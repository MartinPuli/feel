<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="A printed FEEL tag recognized by ARKit image detection gives the room a coordinate frame; targets the user confirmed earlier are stored in that frame on the phone and, when shared, aggregated by Chalk, so a later where-is question points the pins at once while the photo path stays one word away." font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Room memory: a printed tag gives the room a frame, so a remembered target answers before any photo</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5fd9"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5a1f"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7f6a"/></marker></defs><rect x="0" y="0" width="1100" height="560" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="800" fill="#1b1b1b">Room memory: a printed tag gives the room a frame, so a remembered target answers before any photo</text><rect x="20" y="70" width="680" height="460" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3 4"/><text x="30" y="64" font-size="11.5" font-weight="700" fill="#6b6b6b" letter-spacing="0.6">PHONE</text><rect x="40" y="90" width="200" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="140.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Printed FEEL tag</text><text x="140.0" y="124" text-anchor="middle" font-size="11" fill="#1b1b1b">feel-tag-01, printed 20 cm wide</text><text x="140.0" y="138" text-anchor="middle" font-size="11" fill="#1b1b1b">ARKit image detection</text><text x="140.0" y="152" text-anchor="middle" font-size="11" fill="#1b1b1b">frame within about a second</text><rect x="270" y="90" width="200" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="370.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Tag frame</text><text x="370.0" y="124" text-anchor="middle" font-size="11" fill="#1b1b1b">x right · y out · z down</text><text x="370.0" y="138" text-anchor="middle" font-size="11" fill="#1b1b1b">world ↔ tag coordinates</text><text x="370.0" y="152" text-anchor="middle" font-size="11" fill="#1b1b1b">bound to one world epoch</text><rect x="500" y="90" width="180" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="590.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Local anchors</text><text x="590.0" y="124" text-anchor="middle" font-size="11" fill="#1b1b1b">JSON per tag id</text><text x="590.0" y="138" text-anchor="middle" font-size="11" fill="#1b1b1b">Application Support</text><text x="590.0" y="152" text-anchor="middle" font-size="11" fill="#1b1b1b">newest 200 kept</text><path d="M 240 133 L 270 133" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 470 133 L 500 133" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><rect x="40" y="220" width="200" height="70" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="140.0" y="239" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">"Where is the exit?"</text><text x="140.0" y="254" text-anchor="middle" font-size="11" fill="#1b1b1b">tag seen this session?</text><text x="140.0" y="268" text-anchor="middle" font-size="11" fill="#1b1b1b">label remembered here?</text><rect x="270" y="212" width="200" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="370.0" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Remembered place</text><text x="370.0" y="246" text-anchor="middle" font-size="11" fill="#1b1b1b">median of the last 20</text><text x="370.0" y="260" text-anchor="middle" font-size="11" fill="#1b1b1b">sightings for that label,</text><text x="370.0" y="274" text-anchor="middle" font-size="11" fill="#1b1b1b">in this world only</text><path d="M 240 255 L 270 255" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 590 176 L 590 212" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><rect x="593.0" y="187.0" width="130.0" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="658.0" y="198.0" text-anchor="middle" font-size="10.5" fill="#1b1b1b">anchors for this tag</text><rect x="500" y="212" width="180" height="100" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="590.0" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Held target from memory</text><text x="590.0" y="246" text-anchor="middle" font-size="11" fill="#1b1b1b">pins point there at once</text><text x="590.0" y="260" text-anchor="middle" font-size="11" fill="#1b1b1b">"Last time the exit was about</text><text x="590.0" y="274" text-anchor="middle" font-size="11" fill="#1b1b1b">2 meters ahead to your left.</text><text x="590.0" y="288" text-anchor="middle" font-size="11" fill="#1b1b1b">Say photo to check again."</text><path d="M 470 255 L 500 255" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><rect x="471.85" y="236.0" width="26.299999999999997" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="485.0" y="247.0" text-anchor="middle" font-size="10.5" fill="#1b1b1b">hit</text><rect x="500" y="340" width="180" height="86" rx="7" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4"/><text x="590.0" y="359" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Where-is photo path</text><text x="590.0" y="374" text-anchor="middle" font-size="11" fill="#1b1b1b">no memory, or "photo"</text><text x="590.0" y="388" text-anchor="middle" font-size="11" fill="#1b1b1b">gateway or on-device, 2–12 s</text><text x="590.0" y="402" text-anchor="middle" font-size="11" fill="#1b1b1b">same held-target code</text><path d="M 370 298 L 370 383 L 500 383" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#muted)"/><rect x="323.3" y="366" width="93.39999999999999" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="370" y="377" text-anchor="middle" font-size="10.5" fill="#6b6b6b">miss · "photo"</text><rect x="40" y="430" width="200" height="70" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="140.0" y="449" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Confirmed find</text><text x="140.0" y="464" text-anchor="middle" font-size="11" fill="#1b1b1b">"found it" · arrival at the target</text><text x="140.0" y="478" text-anchor="middle" font-size="11" fill="#1b1b1b">target → tag frame → anchor</text><path d="M 240 465 L 690 465 L 690 140 L 590 176" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#muted)"/><rect x="639.7" y="123" width="44.599999999999994" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="662" y="134" text-anchor="middle" font-size="10.5" fill="#6b6b6b">append</text><rect x="270" y="430" width="200" height="70" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="370.0" y="446" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">get_status: room_memory</text><text x="370.0" y="461" text-anchor="middle" font-size="11" fill="#1b1b1b">tag · remembered labels</text><text x="370.0" y="475" text-anchor="middle" font-size="11" fill="#1b1b1b">hits · misses</text><rect x="740" y="70" width="340" height="460" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3 4"/><text x="750" y="64" font-size="11.5" font-weight="700" fill="#6b6b6b" letter-spacing="0.6">CHALK: SHARED MEMORY</text><rect x="760" y="90" width="300" height="70" rx="7" fill="#f1f1f4" stroke="#7a7a8c" stroke-width="1.4"/><text x="910.0" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">anchors table</text><text x="910.0" y="121" text-anchor="middle" font-size="11" fill="#1b1b1b">Supabase Postgres, shared = true only</text><text x="910.0" y="135" text-anchor="middle" font-size="11" fill="#1b1b1b">user · venue · tag · label · x y z · seen_at</text><rect x="760" y="190" width="300" height="100" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="910.0" y="206" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Anchor → RoomMemory</text><text x="910.0" y="221" text-anchor="middle" font-size="11" fill="#1b1b1b">key "&lt;venue&gt;:&lt;tag&gt;"</text><text x="910.0" y="235" text-anchor="middle" font-size="11" fill="#1b1b1b">per label: median of the last 20,</text><text x="910.0" y="249" text-anchor="middle" font-size="11" fill="#1b1b1b">sighting count, last seen</text><text x="910.0" y="263" text-anchor="middle" font-size="11" fill="#1b1b1b">feel_chalk/anchors.py, as on the phone</text><rect x="760" y="320" width="300" height="54" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="910.0" y="336" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Named query room_anchors</text><text x="910.0" y="351" text-anchor="middle" font-size="11" fill="#1b1b1b">spoken · targets · count · last_seen_at</text><rect x="760" y="404" width="300" height="86" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="910.0" y="420" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Assistant says</text><text x="910.0" y="435" text-anchor="middle" font-size="11" fill="#1b1b1b">"Remembered here: exit about 6 meters</text><text x="910.0" y="449" text-anchor="middle" font-size="11" fill="#1b1b1b">ahead-right, seen 4 times, last 2 hours ago."</text><text x="910.0" y="463" text-anchor="middle" font-size="11" fill="#1b1b1b">directions as seen from the tag</text><path d="M 910 160 L 910 190" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 910 290 L 910 320" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 910 374 L 910 404" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 680 112 L 760 112" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#muted)"/><rect x="642.8" y="79.0" width="154.39999999999998" height="30" rx="3" fill="#ffffff" opacity="0.92"/><text x="720.0" y="90.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b">REST insert, user JWT,</text><text x="720.0" y="103.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b">shared unless turned off</text><path d="M 760 347 L 720 347" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><path d="M 720 347 L 720 160 L 680 160" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="611.1" y="143" width="117.8" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="670" y="154" text-anchor="middle" font-size="10.5" fill="#6b6b6b">download (planned)</text><text x="20" y="548" text-anchor="start" font-size="10.5" font-style="italic" fill="#ff5a1f">The pins always come from live depth: memory replaces the photo round trip, never the rows. A tracking reset drops the tag frame and the held target together.</text></svg>
