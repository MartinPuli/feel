<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="A printed FEEL tag recognized by ARKit image detection gives the room a coordinate frame; targets the user confirmed earlier are stored in that frame on the phone and, when shared, aggregated by Chalk, so a later where-is question points the pins at once while the photo path stays one word away." font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Room memory: a printed tag gives the room a frame, so a remembered target answers before any photo</title><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fbfe8"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3c558"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a25a"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b8b0"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9db3aa"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#e3c558" stroke-width="1.2" opacity="0.45"/></pattern><radialGradient id="board" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2b4039"/><stop offset="1" stop-color="#24352f"/></radialGradient></defs><rect x="0" y="0" width="1100" height="560" rx="18" fill="url(#board)"/><text x="20" y="30" font-size="16" font-weight="700" fill="#e9ece7">Room memory: a printed tag gives the room a frame, so a remembered target answers before any photo</text><rect x="20" y="70" width="680" height="460" rx="12" fill="none" stroke="#a9b8b0" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/><text x="30" y="63" font-size="11.5" font-weight="700" fill="#a9b8b0" letter-spacing="1">PHONE</text><rect x="40" y="90" width="200" height="86" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="140.0" y="110" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Printed FEEL tag</text><text x="140.0" y="126" text-anchor="middle" font-size="11" fill="#a9b8b0">feel-tag-01, printed 20 cm wide</text><text x="140.0" y="140" text-anchor="middle" font-size="11" fill="#a9b8b0">ARKit image detection</text><text x="140.0" y="154" text-anchor="middle" font-size="11" fill="#a9b8b0">frame within about a second</text><rect x="270" y="90" width="200" height="86" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="370.0" y="110" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Tag frame</text><text x="370.0" y="126" text-anchor="middle" font-size="11" fill="#a9b8b0">x right · y out · z down</text><text x="370.0" y="140" text-anchor="middle" font-size="11" fill="#a9b8b0">world ↔ tag coordinates</text><text x="370.0" y="154" text-anchor="middle" font-size="11" fill="#a9b8b0">bound to one world epoch</text><rect x="500" y="90" width="180" height="86" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="590.0" y="110" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Local anchors</text><text x="590.0" y="126" text-anchor="middle" font-size="11" fill="#a9b8b0">JSON per tag id</text><text x="590.0" y="140" text-anchor="middle" font-size="11" fill="#a9b8b0">Application Support</text><text x="590.0" y="154" text-anchor="middle" font-size="11" fill="#a9b8b0">newest 200 kept</text><path d="M 240 133 L 270 133" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M 470 133 L 500 133" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="40" y="220" width="200" height="70" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="140.0" y="240" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">"Where is the exit?"</text><text x="140.0" y="256" text-anchor="middle" font-size="11" fill="#a9b8b0">tag seen this session?</text><text x="140.0" y="270" text-anchor="middle" font-size="11" fill="#a9b8b0">label remembered here?</text><rect x="270" y="212" width="200" height="86" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="370.0" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Remembered place</text><text x="370.0" y="248" text-anchor="middle" font-size="11" fill="#a9b8b0">median of the last 20</text><text x="370.0" y="262" text-anchor="middle" font-size="11" fill="#a9b8b0">sightings for that label,</text><text x="370.0" y="276" text-anchor="middle" font-size="11" fill="#a9b8b0">in this world only</text><path d="M 240 255 L 270 255" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M 590 176 L 590 212" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="593.0" y="187.0" width="130.0" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="658.0" y="198.0" text-anchor="middle" font-size="10.5" fill="#8fbfe8">anchors for this tag</text><rect x="500" y="212" width="180" height="100" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="590.0" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Held target from memory</text><text x="590.0" y="248" text-anchor="middle" font-size="11" fill="#a9b8b0">pins point there at once</text><text x="590.0" y="262" text-anchor="middle" font-size="11" fill="#a9b8b0">"Last time the exit was about</text><text x="590.0" y="276" text-anchor="middle" font-size="11" fill="#a9b8b0">2 meters ahead to your left.</text><text x="590.0" y="290" text-anchor="middle" font-size="11" fill="#a9b8b0">Say photo to check again."</text><path d="M 470 255 L 500 255" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="471.85" y="236.0" width="26.299999999999997" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="485.0" y="247.0" text-anchor="middle" font-size="10.5" fill="#8fbfe8">hit</text><rect x="500" y="340" width="180" height="86" rx="9" fill="#24352f" stroke="#a9b8b0" stroke-width="1.6"/><text x="590.0" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Where-is photo path</text><text x="590.0" y="376" text-anchor="middle" font-size="11" fill="#a9b8b0">no memory, or "photo"</text><text x="590.0" y="390" text-anchor="middle" font-size="11" fill="#a9b8b0">gateway or on-device, 2–12 s</text><text x="590.0" y="404" text-anchor="middle" font-size="11" fill="#a9b8b0">same held-target code</text><path d="M 370 298 L 370 383 L 500 383" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted)"/><rect x="323.3" y="366" width="93.39999999999999" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="370" y="377" text-anchor="middle" font-size="10.5" fill="#a9b8b0">miss · "photo"</text><rect x="40" y="430" width="200" height="70" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="140.0" y="450" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Confirmed find</text><text x="140.0" y="466" text-anchor="middle" font-size="11" fill="#a9b8b0">"found it" · arrival at the target</text><text x="140.0" y="480" text-anchor="middle" font-size="11" fill="#a9b8b0">target → tag frame → anchor</text><path d="M 240 465 L 690 465 L 690 140 L 590 176" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted)"/><rect x="639.7" y="123" width="44.599999999999994" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="662" y="134" text-anchor="middle" font-size="10.5" fill="#a9b8b0">append</text><rect x="270" y="430" width="200" height="70" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="370.0" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">get_status: room_memory</text><text x="370.0" y="463" text-anchor="middle" font-size="11" fill="#a9b8b0">tag · remembered labels</text><text x="370.0" y="477" text-anchor="middle" font-size="11" fill="#a9b8b0">hits · misses</text><rect x="740" y="70" width="340" height="460" rx="12" fill="none" stroke="#a9b8b0" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/><text x="750" y="63" font-size="11.5" font-weight="700" fill="#a9b8b0" letter-spacing="1">CHALK: SHARED MEMORY</text><rect x="760" y="90" width="300" height="70" rx="9" fill="#1a2b26" stroke="#8e9aa6" stroke-width="1.6"/><text x="910.0" y="107" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">anchors table</text><text x="910.0" y="123" text-anchor="middle" font-size="11" fill="#a9b8b0">Supabase Postgres, shared = true only</text><text x="910.0" y="137" text-anchor="middle" font-size="11" fill="#a9b8b0">user · venue · tag · label · x y z · seen_at</text><rect x="765" y="195" width="300" height="100" rx="9" fill="url(#hatch)"/><rect x="760" y="190" width="300" height="100" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="910.0" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Anchor → RoomMemory</text><text x="910.0" y="223" text-anchor="middle" font-size="11" fill="#a9b8b0">key "&lt;venue&gt;:&lt;tag&gt;"</text><text x="910.0" y="237" text-anchor="middle" font-size="11" fill="#a9b8b0">per label: median of the last 20,</text><text x="910.0" y="251" text-anchor="middle" font-size="11" fill="#a9b8b0">sighting count, last seen</text><text x="910.0" y="265" text-anchor="middle" font-size="11" fill="#a9b8b0">feel_chalk/anchors.py, as on the phone</text><rect x="765" y="325" width="300" height="54" rx="9" fill="url(#hatch)"/><rect x="760" y="320" width="300" height="54" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="910.0" y="337" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Named query room_anchors</text><text x="910.0" y="353" text-anchor="middle" font-size="11" fill="#a9b8b0">spoken · targets · count · last_seen_at</text><rect x="760" y="404" width="300" height="86" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="910.0" y="421" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Assistant says</text><text x="910.0" y="437" text-anchor="middle" font-size="11" fill="#a9b8b0">"Remembered here: exit about 6 meters</text><text x="910.0" y="451" text-anchor="middle" font-size="11" fill="#a9b8b0">ahead-right, seen 4 times, last 2 hours ago."</text><text x="910.0" y="465" text-anchor="middle" font-size="11" fill="#a9b8b0">directions as seen from the tag</text><path d="M 910 160 L 910 190" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 910 290 L 910 320" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 910 374 L 910 404" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 680 112 L 760 112" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted)"/><rect x="642.8" y="79.0" width="154.39999999999998" height="30" rx="3" fill="#24352f" opacity="0.92"/><text x="720.0" y="90.0" text-anchor="middle" font-size="10.5" fill="#a9b8b0">REST insert, user JWT,</text><text x="720.0" y="103.0" text-anchor="middle" font-size="10.5" fill="#a9b8b0">shared unless turned off</text><path d="M 760 347 L 720 347" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#muted)"/><path d="M 720 347 L 720 160 L 680 160" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="611.1" y="143" width="117.8" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="670" y="154" text-anchor="middle" font-size="10.5" fill="#a9b8b0">download (planned)</text><text x="20" y="548" text-anchor="start" font-size="10.5" font-style="italic" fill="#f0a25a">The pins always come from live depth: memory replaces the photo round trip, never the rows. A tracking reset drops the tag frame and the held target together.</text></svg>
