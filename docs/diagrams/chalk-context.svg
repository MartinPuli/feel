<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="The phone writes confirmed finds to Supabase Postgres; Chalk reads the same tables as a data source, resolves the latest find per object into a spoken sentence and builds venue packs from reviewed entries; named queries serve both to the assistant, and packs are answered offline on the phone." font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Memory and venue knowledge: Postgres rows become Chalk features the assistant can say</title><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fbfe8"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3c558"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a25a"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b8b0"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9db3aa"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#e3c558" stroke-width="1.2" opacity="0.45"/></pattern><radialGradient id="board" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2b4039"/><stop offset="1" stop-color="#24352f"/></radialGradient></defs><rect x="0" y="0" width="1100" height="560" rx="18" fill="url(#board)"/><text x="20" y="30" font-size="16" font-weight="700" fill="#e9ece7">Memory and venue knowledge: Postgres rows become Chalk features the assistant can say</text><rect x="20" y="70" width="230" height="460" rx="12" fill="none" stroke="#a9b8b0" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/><text x="30" y="63" font-size="11.5" font-weight="700" fill="#a9b8b0" letter-spacing="1">PHONE</text><rect x="40" y="90" width="190" height="80" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="135.0" y="110" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">"Found it"</text><text x="135.0" y="126" text-anchor="middle" font-size="11" fill="#a9b8b0">after Where-is or a finder</text><text x="135.0" y="140" text-anchor="middle" font-size="11" fill="#a9b8b0">pointed at the thing</text><rect x="40" y="200" width="190" height="80" rx="9" fill="#24352f" stroke="#a9b8b0" stroke-width="1.6" stroke-dasharray="6 4"/><text x="135.0" y="220" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Write a find</text><text x="135.0" y="236" text-anchor="middle" font-size="11" fill="#a9b8b0">Supabase REST, user JWT</text><text x="135.0" y="250" text-anchor="middle" font-size="11" fill="#a9b8b0">row-level security: own rows</text><rect x="40" y="330" width="190" height="80" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="135.0" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Ask</text><text x="135.0" y="366" text-anchor="middle" font-size="11" fill="#a9b8b0">"where did I last</text><text x="135.0" y="380" text-anchor="middle" font-size="11" fill="#a9b8b0">see my keys?"</text><rect x="40" y="440" width="190" height="70" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="135.0" y="460" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Venue pack store</text><text x="135.0" y="476" text-anchor="middle" font-size="11" fill="#a9b8b0">answers without internet</text><text x="135.0" y="490" text-anchor="middle" font-size="11" fill="#a9b8b0">hash-checked, expires</text><path d="M 135 170 L 135 200" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="290" y="70" width="220" height="460" rx="12" fill="none" stroke="#a9b8b0" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/><text x="300" y="63" font-size="11.5" font-weight="700" fill="#a9b8b0" letter-spacing="1">SUPABASE POSTGRES</text><rect x="310" y="150" width="180" height="70" rx="9" fill="#1a2b26" stroke="#8e9aa6" stroke-width="1.6"/><text x="400.0" y="170" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">confirmed_finds</text><text x="400.0" y="186" text-anchor="middle" font-size="11" fill="#a9b8b0">user_id · object_name</text><text x="400.0" y="200" text-anchor="middle" font-size="11" fill="#a9b8b0">place · confidence · found_at</text><rect x="310" y="300" width="180" height="90" rx="9" fill="#1a2b26" stroke="#8e9aa6" stroke-width="1.6"/><text x="400.0" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">venues · venue_entries</text><text x="400.0" y="336" text-anchor="middle" font-size="11" fill="#a9b8b0">reviewed HTTPS sources</text><text x="400.0" y="350" text-anchor="middle" font-size="11" fill="#a9b8b0">effective dates, restrictions</text><text x="400.0" y="364" text-anchor="middle" font-size="11" fill="#a9b8b0">sql/schema.sql · sql/seed.sql</text><path d="M 230 240 L 310 185" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="247.7" y="195.5" width="44.599999999999994" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="270.0" y="206.5" text-anchor="middle" font-size="10.5" fill="#a9b8b0">insert</text><rect x="550" y="70" width="300" height="460" rx="12" fill="none" stroke="#a9b8b0" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/><text x="560" y="63" font-size="11.5" font-weight="700" fill="#a9b8b0" letter-spacing="1">CHALK (CHALK/FEEL_CONTEXT)</text><rect x="575" y="95" width="260" height="54" rx="9" fill="url(#hatch)"/><rect x="570" y="90" width="260" height="54" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="700.0" y="107" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Data source "feel_finds"</text><text x="700.0" y="123" text-anchor="middle" font-size="11" fill="#a9b8b0">PostgreSQL · credentials stay in Chalk</text><rect x="575" y="169" width="260" height="100" rx="9" fill="url(#hatch)"/><rect x="570" y="164" width="260" height="100" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="700.0" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Find → ObjectHistory</text><text x="700.0" y="197" text-anchor="middle" font-size="11" fill="#a9b8b0">finds_of_history: SQL by "&lt;user&gt;:&lt;object&gt;"</text><text x="700.0" y="211" text-anchor="middle" font-size="11" fill="#a9b8b0">last_find: the latest confirmed find wins</text><text x="700.0" y="225" text-anchor="middle" font-size="11" fill="#a9b8b0">spoken_history(Now): relative time,</text><text x="700.0" y="239" text-anchor="middle" font-size="11" fill="#a9b8b0">never a present-tense claim</text><rect x="575" y="289" width="260" height="86" rx="9" fill="url(#hatch)"/><rect x="570" y="284" width="260" height="86" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="700.0" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">VenueEntry → Venue.pack</text><text x="700.0" y="317" text-anchor="middle" font-size="11" fill="#a9b8b0">venue_row · venue_entries: SQL</text><text x="700.0" y="331" text-anchor="middle" font-size="11" fill="#a9b8b0">build_pack: feel_chalk.venue_pack.build,</text><text x="700.0" y="345" text-anchor="middle" font-size="11" fill="#a9b8b0">byte-identical to the local builder</text><rect x="575" y="395" width="260" height="60" rx="9" fill="url(#hatch)"/><rect x="570" y="390" width="260" height="60" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="700.0" y="407" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Named queries</text><text x="700.0" y="423" text-anchor="middle" font-size="11" fill="#a9b8b0">last_seen · venue_pack</text><text x="700.0" y="437" text-anchor="middle" font-size="11" fill="#a9b8b0">inputs and outputs pinned at deploy</text><rect x="570" y="470" width="260" height="48" rx="9" fill="#24352f" stroke="#a9b8b0" stroke-width="1.6" stroke-dasharray="6 4"/><text x="700.0" y="487" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">ScheduledQuery: daily packs</text><text x="700.0" y="503" text-anchor="middle" font-size="11" fill="#a9b8b0">planned</text><path d="M 490 185 L 570 214" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 490 345 L 570 327" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 700 144 L 700 164" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 700 264 L 700 284" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 700 370 L 700 390" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="890" y="70" width="190" height="460" rx="12" fill="none" stroke="#a9b8b0" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/><text x="900" y="63" font-size="11.5" font-weight="700" fill="#a9b8b0" letter-spacing="1">SERVED</text><rect x="910" y="155" width="160" height="100" rx="9" fill="url(#hatch)"/><rect x="905" y="150" width="160" height="100" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="985.0" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Service token</text><text x="985.0" y="183" text-anchor="middle" font-size="11" fill="#a9b8b0">CHALK_CLIENT_ID + SECRET,</text><text x="985.0" y="197" text-anchor="middle" font-size="11" fill="#a9b8b0">scoped to one environment</text><text x="985.0" y="211" text-anchor="middle" font-size="11" fill="#a9b8b0">feel_chalk.context today,</text><text x="985.0" y="225" text-anchor="middle" font-size="11" fill="#a9b8b0">the phone next</text><rect x="905" y="290" width="160" height="90" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="985.0" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Assistant says</text><text x="985.0" y="323" text-anchor="middle" font-size="11" fill="#a9b8b0">"Keys: last confirmed at</text><text x="985.0" y="337" text-anchor="middle" font-size="11" fill="#a9b8b0">the kitchen table,</text><text x="985.0" y="351" text-anchor="middle" font-size="11" fill="#a9b8b0">2 hours ago."</text><rect x="905" y="410" width="160" height="70" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="985.0" y="427" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Pack download</text><text x="985.0" y="443" text-anchor="middle" font-size="11" fill="#a9b8b0">{schema, sha256,</text><text x="985.0" y="457" text-anchor="middle" font-size="11" fill="#a9b8b0">payload}</text><path d="M 830 420 L 858 420 L 858 200 L 905 200" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="811.3" y="183" width="93.39999999999999" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="858" y="194" text-anchor="middle" font-size="10.5" fill="#e3c558">POST /v1/query</text><path d="M 985 250 L 985 290" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 985 380 L 985 410" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 905 445 L 882 445 L 882 475 L 230 475" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="431.95" y="458" width="136.1" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="500" y="469" text-anchor="middle" font-size="10.5" fill="#a9b8b0">HTTPS, when connected</text><path d="M 230 370 L 270 370 L 270 548 L 870 548 L 870 335 L 905 335" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="606.2" y="531" width="227.6" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="720" y="542" text-anchor="middle" font-size="10.5" fill="#a9b8b0">planned: last_seen tool on the phone</text></svg>
