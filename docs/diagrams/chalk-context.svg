<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="The phone writes confirmed finds to Supabase Postgres; Chalk reads the same tables as a data source, resolves the latest find per object into a spoken sentence and builds venue packs from reviewed entries; named queries serve both to the assistant, and packs are answered offline on the phone." font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Memory and venue knowledge: Postgres rows become Chalk features the assistant can say</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5fd9"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5a1f"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7f6a"/></marker></defs><rect x="0" y="0" width="1100" height="560" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="800" fill="#1b1b1b">Memory and venue knowledge: Postgres rows become Chalk features the assistant can say</text><rect x="20" y="70" width="230" height="460" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3 4"/><text x="30" y="64" font-size="11.5" font-weight="700" fill="#6b6b6b" letter-spacing="0.6">PHONE</text><rect x="40" y="90" width="190" height="80" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="135.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">"Found it"</text><text x="135.0" y="124" text-anchor="middle" font-size="11" fill="#1b1b1b">after Where-is or a finder</text><text x="135.0" y="138" text-anchor="middle" font-size="11" fill="#1b1b1b">pointed at the thing</text><rect x="40" y="200" width="190" height="80" rx="7" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="135.0" y="219" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Write a find</text><text x="135.0" y="234" text-anchor="middle" font-size="11" fill="#1b1b1b">Supabase REST, user JWT</text><text x="135.0" y="248" text-anchor="middle" font-size="11" fill="#1b1b1b">row-level security: own rows</text><rect x="40" y="330" width="190" height="80" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="135.0" y="349" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Ask</text><text x="135.0" y="364" text-anchor="middle" font-size="11" fill="#1b1b1b">"where did I last</text><text x="135.0" y="378" text-anchor="middle" font-size="11" fill="#1b1b1b">see my keys?"</text><rect x="40" y="440" width="190" height="70" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="135.0" y="459" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Venue pack store</text><text x="135.0" y="474" text-anchor="middle" font-size="11" fill="#1b1b1b">answers without internet</text><text x="135.0" y="488" text-anchor="middle" font-size="11" fill="#1b1b1b">hash-checked, expires</text><path d="M 135 170 L 135 200" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="290" y="70" width="220" height="460" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3 4"/><text x="300" y="64" font-size="11.5" font-weight="700" fill="#6b6b6b" letter-spacing="0.6">SUPABASE POSTGRES</text><rect x="310" y="150" width="180" height="70" rx="7" fill="#f1f1f4" stroke="#7a7a8c" stroke-width="1.4"/><text x="400.0" y="169" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">confirmed_finds</text><text x="400.0" y="184" text-anchor="middle" font-size="11" fill="#1b1b1b">user_id · object_name</text><text x="400.0" y="198" text-anchor="middle" font-size="11" fill="#1b1b1b">place · confidence · found_at</text><rect x="310" y="300" width="180" height="90" rx="7" fill="#f1f1f4" stroke="#7a7a8c" stroke-width="1.4"/><text x="400.0" y="319" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">venues · venue_entries</text><text x="400.0" y="334" text-anchor="middle" font-size="11" fill="#1b1b1b">reviewed HTTPS sources</text><text x="400.0" y="348" text-anchor="middle" font-size="11" fill="#1b1b1b">effective dates, restrictions</text><text x="400.0" y="362" text-anchor="middle" font-size="11" fill="#1b1b1b">sql/schema.sql · sql/seed.sql</text><path d="M 230 240 L 310 185" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="247.7" y="195.5" width="44.599999999999994" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="270.0" y="206.5" text-anchor="middle" font-size="10.5" fill="#6b6b6b">insert</text><rect x="550" y="70" width="300" height="460" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3 4"/><text x="560" y="64" font-size="11.5" font-weight="700" fill="#6b6b6b" letter-spacing="0.6">CHALK (CHALK/FEEL_CONTEXT)</text><rect x="570" y="90" width="260" height="54" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="700.0" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Data source "feel_finds"</text><text x="700.0" y="121" text-anchor="middle" font-size="11" fill="#1b1b1b">PostgreSQL · credentials stay in Chalk</text><rect x="570" y="164" width="260" height="100" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="700.0" y="180" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Find → ObjectHistory</text><text x="700.0" y="195" text-anchor="middle" font-size="11" fill="#1b1b1b">finds_of_history: SQL by "&lt;user&gt;:&lt;object&gt;"</text><text x="700.0" y="209" text-anchor="middle" font-size="11" fill="#1b1b1b">last_find: the latest confirmed find wins</text><text x="700.0" y="223" text-anchor="middle" font-size="11" fill="#1b1b1b">spoken_history(Now): relative time,</text><text x="700.0" y="237" text-anchor="middle" font-size="11" fill="#1b1b1b">never a present-tense claim</text><rect x="570" y="284" width="260" height="86" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="700.0" y="300" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">VenueEntry → Venue.pack</text><text x="700.0" y="315" text-anchor="middle" font-size="11" fill="#1b1b1b">venue_row · venue_entries: SQL</text><text x="700.0" y="329" text-anchor="middle" font-size="11" fill="#1b1b1b">build_pack: feel_chalk.venue_pack.build,</text><text x="700.0" y="343" text-anchor="middle" font-size="11" fill="#1b1b1b">byte-identical to the local builder</text><rect x="570" y="390" width="260" height="60" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="700.0" y="406" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Named queries</text><text x="700.0" y="421" text-anchor="middle" font-size="11" fill="#1b1b1b">last_seen · venue_pack</text><text x="700.0" y="435" text-anchor="middle" font-size="11" fill="#1b1b1b">inputs and outputs pinned at deploy</text><rect x="570" y="470" width="260" height="48" rx="7" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="700.0" y="486" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">ScheduledQuery: daily packs</text><text x="700.0" y="501" text-anchor="middle" font-size="11" fill="#1b1b1b">planned</text><path d="M 490 185 L 570 214" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 490 345 L 570 327" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 700 144 L 700 164" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 700 264 L 700 284" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 700 370 L 700 390" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="890" y="70" width="190" height="460" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3 4"/><text x="900" y="64" font-size="11.5" font-weight="700" fill="#6b6b6b" letter-spacing="0.6">SERVED</text><rect x="905" y="150" width="160" height="100" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="985.0" y="166" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Service token</text><text x="985.0" y="181" text-anchor="middle" font-size="11" fill="#1b1b1b">CHALK_CLIENT_ID + SECRET,</text><text x="985.0" y="195" text-anchor="middle" font-size="11" fill="#1b1b1b">scoped to one environment</text><text x="985.0" y="209" text-anchor="middle" font-size="11" fill="#1b1b1b">feel_chalk.context today,</text><text x="985.0" y="223" text-anchor="middle" font-size="11" fill="#1b1b1b">the phone next</text><rect x="905" y="290" width="160" height="90" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="985.0" y="306" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Assistant says</text><text x="985.0" y="321" text-anchor="middle" font-size="11" fill="#1b1b1b">"Keys: last confirmed at</text><text x="985.0" y="335" text-anchor="middle" font-size="11" fill="#1b1b1b">the kitchen table,</text><text x="985.0" y="349" text-anchor="middle" font-size="11" fill="#1b1b1b">2 hours ago."</text><rect x="905" y="410" width="160" height="70" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="985.0" y="426" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Pack download</text><text x="985.0" y="441" text-anchor="middle" font-size="11" fill="#1b1b1b">{schema, sha256,</text><text x="985.0" y="455" text-anchor="middle" font-size="11" fill="#1b1b1b">payload}</text><path d="M 830 420 L 858 420 L 858 200 L 905 200" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="811.3" y="183" width="93.39999999999999" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="858" y="194" text-anchor="middle" font-size="10.5" fill="#2b5fd9">POST /v1/query</text><path d="M 985 250 L 985 290" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 985 380 L 985 410" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 905 445 L 882 445 L 882 475 L 230 475" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="431.95" y="458" width="136.1" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="500" y="469" text-anchor="middle" font-size="10.5" fill="#6b6b6b">HTTPS, when connected</text><path d="M 230 370 L 270 370 L 270 548 L 870 548 L 870 335 L 905 335" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="606.2" y="531" width="227.6" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="720" y="542" text-anchor="middle" font-size="10.5" fill="#6b6b6b">planned: last_seen tool on the phone</text></svg>
