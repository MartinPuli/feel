<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-label="A spoken Where-is question becomes one photo through the Chalk Model Gateway, validated on the phone and placed with LiDAR depth; any failure within the shared 12 second deadline falls back to on-device detectors on the same placement path." font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>One Where-is request: through the Model Gateway, or the phone alone</title><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fbfe8"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3c558"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a25a"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b8b0"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9db3aa"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#e3c558" stroke-width="1.2" opacity="0.45"/></pattern><radialGradient id="board" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2b4039"/><stop offset="1" stop-color="#24352f"/></radialGradient></defs><rect x="0" y="0" width="1100" height="430" rx="18" fill="url(#board)"/><text x="20" y="30" font-size="16" font-weight="700" fill="#e9ece7">One Where-is request: through the Model Gateway, or the phone alone</text><rect x="20" y="80" width="130" height="72" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="85.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Spoken ask</text><text x="85.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">"where is</text><text x="85.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">the desk?"</text><rect x="170" y="80" width="150" height="72" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="245.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Snapshot</text><text x="245.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">JPEG ≤ 1024 px, q 0.6</text><text x="245.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">depth + pose, kept in RAM</text><rect x="345" y="85" width="220" height="72" rx="9" fill="url(#hatch)"/><rect x="340" y="80" width="220" height="72" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="450.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Chalk Model Gateway</text><text x="450.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">POST /chat/completions</text><text x="450.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">restricted key · X-Chalk-Env-Id</text><text x="450.0" y="144" text-anchor="middle" font-size="11" fill="#a9b8b0">FEEL_CHALK_MODEL picks the model</text><rect x="585" y="85" width="160" height="72" rx="9" fill="url(#hatch)"/><rect x="580" y="80" width="160" height="72" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="660.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Reply contract</text><text x="660.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">{found, label,</text><text x="660.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">box, confidence}</text><text x="660.0" y="144" text-anchor="middle" font-size="11" fill="#a9b8b0">or not found</text><rect x="760" y="80" width="170" height="72" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="845.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Phone validates</text><text x="845.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">parse · deadline · world epoch</text><text x="845.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">tracking · request ownership</text><rect x="950" y="80" width="130" height="72" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="1015.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Held target</text><text x="1015.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">depth at box centre</text><text x="1015.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">pins + spoken line</text><path d="M 150 116 L 170 116" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M 320 116 L 340 116" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 560 116 L 580 116" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 740 116 L 760 116" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 930 116 L 950 116" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M 340 62 L 340 54 L 740 54 L 740 62" fill="none" stroke="#e3c558" stroke-width="1.2"/><text x="540" y="50" text-anchor="middle" font-size="10.5" font-style="italic" fill="#e3c558">one absolute 12 s deadline, shared by phone and evaluation (protocol/where-is-cases.json)</text><rect x="340" y="250" width="400" height="86" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="540.0" y="270" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">On-device fallback</text><text x="540.0" y="286" text-anchor="middle" font-size="11" fill="#a9b8b0">Vision text for EXIT · rectangles for doors · people</text><text x="540.0" y="300" text-anchor="middle" font-size="11" fill="#a9b8b0">bundled Core ML detector for chairs and common objects</text><text x="540.0" y="314" text-anchor="middle" font-size="11" fill="#a9b8b0">same JSON contract, same placement</text><path d="M 450 152 L 450 250" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="463.35" y="190.0" width="209.29999999999998" height="30" rx="3" fill="#24352f" opacity="0.92"/><text x="568.0" y="201.0" text-anchor="middle" font-size="10.5" fill="#a9b8b0">no setup · transport error</text><text x="568.0" y="214.0" text-anchor="middle" font-size="10.5" fill="#a9b8b0">malformed reply · deadline passed</text><path d="M 740 293 L 845 293 L 845 152" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="847.25" y="282" width="99.5" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="897" y="293" text-anchor="middle" font-size="10.5" fill="#a9b8b0">fallback result</text><rect x="20" y="250" width="290" height="86" rx="9" fill="#24352f" stroke="#a9b8b0" stroke-width="1.6"/><text x="165.0" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">What never happens</text><text x="165.0" y="283" text-anchor="middle" font-size="11" fill="#a9b8b0">no photo is stored or sent anywhere else</text><text x="165.0" y="297" text-anchor="middle" font-size="11" fill="#a9b8b0">a valid "not found" does not trigger the fallback</text><text x="165.0" y="311" text-anchor="middle" font-size="11" fill="#a9b8b0">a found box is a direction, not a clear path</text><text x="20" y="400" text-anchor="start" font-size="10.5" font-style="italic" fill="#a9b8b0">Snapshot and placement are local; the gateway round trip is the only network hop. A gateway failure is named in the status next to the fallback result.</text></svg>
