<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-label="A spoken Where-is question becomes one photo through the Chalk Model Gateway, validated on the phone and placed with LiDAR depth; any failure within the shared 12 second deadline falls back to on-device detectors on the same placement path." font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>One Where-is request: through the Model Gateway, or the phone alone</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5fd9"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5a1f"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7f6a"/></marker></defs><rect x="0" y="0" width="1100" height="430" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="800" fill="#1b1b1b">One Where-is request: through the Model Gateway, or the phone alone</text><rect x="20" y="80" width="130" height="72" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="85.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Spoken ask</text><text x="85.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">"where is</text><text x="85.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">the desk?"</text><rect x="170" y="80" width="150" height="72" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="245.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Snapshot</text><text x="245.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">JPEG ≤ 1024 px, q 0.6</text><text x="245.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">depth + pose, kept in RAM</text><rect x="340" y="80" width="220" height="72" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="450.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Chalk Model Gateway</text><text x="450.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">POST /chat/completions</text><text x="450.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">restricted key · X-Chalk-Env-Id</text><text x="450.0" y="142" text-anchor="middle" font-size="11" fill="#1b1b1b">FEEL_CHALK_MODEL picks the model</text><rect x="580" y="80" width="160" height="72" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="660.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Reply contract</text><text x="660.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">{found, label,</text><text x="660.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">box, confidence}</text><text x="660.0" y="142" text-anchor="middle" font-size="11" fill="#1b1b1b">or not found</text><rect x="760" y="80" width="170" height="72" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="845.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Phone validates</text><text x="845.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">parse · deadline · world epoch</text><text x="845.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">tracking · request ownership</text><rect x="950" y="80" width="130" height="72" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="1015.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Held target</text><text x="1015.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">depth at box centre</text><text x="1015.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">pins + spoken line</text><path d="M 150 116 L 170 116" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 320 116 L 340 116" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 560 116 L 580 116" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 740 116 L 760 116" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 930 116 L 950 116" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 340 62 L 340 54 L 740 54 L 740 62" fill="none" stroke="#2b5fd9" stroke-width="1.2"/><text x="540" y="50" text-anchor="middle" font-size="10.5" font-style="italic" fill="#2b5fd9">one absolute 12 s deadline, shared by phone and evaluation (protocol/where-is-cases.json)</text><rect x="340" y="250" width="400" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="540.0" y="269" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">On-device fallback</text><text x="540.0" y="284" text-anchor="middle" font-size="11" fill="#1b1b1b">Vision text for EXIT · rectangles for doors · people</text><text x="540.0" y="298" text-anchor="middle" font-size="11" fill="#1b1b1b">bundled Core ML detector for chairs and common objects</text><text x="540.0" y="312" text-anchor="middle" font-size="11" fill="#1b1b1b">same JSON contract, same placement</text><path d="M 450 152 L 450 250" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="463.35" y="190.0" width="209.29999999999998" height="30" rx="3" fill="#ffffff" opacity="0.92"/><text x="568.0" y="201.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b">no setup · transport error</text><text x="568.0" y="214.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b">malformed reply · deadline passed</text><path d="M 740 293 L 845 293 L 845 152" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="847.25" y="282" width="99.5" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="897" y="293" text-anchor="middle" font-size="10.5" fill="#6b6b6b">fallback result</text><rect x="20" y="250" width="290" height="86" rx="7" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4"/><text x="165.0" y="266" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">What never happens</text><text x="165.0" y="281" text-anchor="middle" font-size="11" fill="#1b1b1b">no photo is stored or sent anywhere else</text><text x="165.0" y="295" text-anchor="middle" font-size="11" fill="#1b1b1b">a valid "not found" does not trigger the fallback</text><text x="165.0" y="309" text-anchor="middle" font-size="11" fill="#1b1b1b">a found box is a direction, not a clear path</text><text x="20" y="400" text-anchor="start" font-size="10.5" font-style="italic" fill="#6b6b6b">Snapshot and placement are local; the gateway round trip is the only network hop. A gateway failure is named in the status next to the fallback result.</text></svg>
