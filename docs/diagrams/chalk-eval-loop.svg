<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-label="Labeled photos pass a local preflight, run either locally through the gateway or as a hosted Chalk evaluation with three scorers, and produce one report with per-metric denominators that selects the gateway model." font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>The evaluation loop: identical inputs, explicit denominators, a model picked by evidence</title><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fbfe8"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3c558"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a25a"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b8b0"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9db3aa"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#e3c558" stroke-width="1.2" opacity="0.45"/></pattern><radialGradient id="board" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2b4039"/><stop offset="1" stop-color="#24352f"/></radialGradient></defs><rect x="0" y="0" width="1040" height="520" rx="18" fill="url(#board)"/><text x="20" y="30" font-size="16" font-weight="700" fill="#e9ece7">The evaluation loop: identical inputs, explicit denominators, a model picked by evidence</text><rect x="20" y="70" width="230" height="70" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="135.0" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Consented photos + labels</text><text x="135.0" y="106" text-anchor="middle" font-size="11" fill="#a9b8b0">labels.jsonl: image, question, box</text><text x="135.0" y="120" text-anchor="middle" font-size="11" fill="#a9b8b0">at least one third absent</text><rect x="20" y="160" width="230" height="70" rx="9" fill="#24352f" stroke="#a9b8b0" stroke-width="1.6"/><text x="135.0" y="180" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Synthetic set</text><text x="135.0" y="196" text-anchor="middle" font-size="11" fill="#a9b8b0">evals/make_synthetic.py</text><text x="135.0" y="210" text-anchor="middle" font-size="11" fill="#a9b8b0">EXIT signs and doors on walls</text><rect x="290" y="100" width="240" height="100" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="410.0" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Preflight, no cloud</text><text x="410.0" y="136" text-anchor="middle" font-size="11" fill="#a9b8b0">validate labels, confine image paths</text><text x="410.0" y="150" text-anchor="middle" font-size="11" fill="#a9b8b0">re-encode as the phone does (≤ 1024 px, q 0.6)</text><text x="410.0" y="164" text-anchor="middle" font-size="11" fill="#a9b8b0">SHA-256 of dataset and prompt</text><path d="M 250 105 L 290 140" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M 250 195 L 290 160" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="575" y="75" width="220" height="76" rx="9" fill="url(#hatch)"/><rect x="570" y="70" width="220" height="76" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="680.0" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Local run  --local</text><text x="680.0" y="106" text-anchor="middle" font-size="11" fill="#a9b8b0">task + scorers on this Mac</text><text x="680.0" y="120" text-anchor="middle" font-size="11" fill="#a9b8b0">each row through the gateway</text><rect x="575" y="169" width="220" height="96" rx="9" fill="url(#hatch)"/><rect x="570" y="164" width="220" height="96" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="680.0" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Hosted run</text><text x="680.0" y="200" text-anchor="middle" font-size="11" fill="#a9b8b0">upload dataset · deploy task</text><text x="680.0" y="214" text-anchor="middle" font-size="11" fill="#a9b8b0">and scorers · evaluation run</text><text x="680.0" y="228" text-anchor="middle" font-size="11" fill="#a9b8b0">result dataset by run ID</text><path d="M 530 140 L 570 108" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 530 160 L 570 212" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="835" y="75" width="190" height="190" rx="9" fill="url(#hatch)"/><rect x="830" y="70" width="190" height="190" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="925.0" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Three scorers</text><text x="925.0" y="103" text-anchor="middle" font-size="11" fill="#a9b8b0">points_correctly</text><text x="925.0" y="117" text-anchor="middle" font-size="11" fill="#a9b8b0">box centre inside the label,</text><text x="925.0" y="131" text-anchor="middle" font-size="11" fill="#a9b8b0">or absent and "not found"</text><text x="925.0" y="145" text-anchor="middle" font-size="11" fill="#a9b8b0"></text><text x="925.0" y="159" text-anchor="middle" font-size="11" fill="#a9b8b0">reply_is_well_formed</text><text x="925.0" y="173" text-anchor="middle" font-size="11" fill="#a9b8b0">obeys the JSON contract</text><text x="925.0" y="187" text-anchor="middle" font-size="11" fill="#a9b8b0"></text><text x="925.0" y="201" text-anchor="middle" font-size="11" fill="#a9b8b0">false_found</text><text x="925.0" y="215" text-anchor="middle" font-size="11" fill="#a9b8b0">absent, yet claimed seen</text><path d="M 790 108 L 830 108" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 790 212 L 830 212" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="290" y="300" width="500" height="110" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="540.0" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">One report shape for both runs</text><text x="540.0" y="336" text-anchor="middle" font-size="11" fill="#a9b8b0">present localization · absent accuracy · false found · well-formed · missing response,</text><text x="540.0" y="350" text-anchor="middle" font-size="11" fill="#a9b8b0">each as numerator / denominator</text><text x="540.0" y="364" text-anchor="middle" font-size="11" fill="#a9b8b0">latency p50 · p95 · max, token usage, resolved model, run and dataset IDs</text><text x="540.0" y="378" text-anchor="middle" font-size="11" fill="#a9b8b0">no photo, question, reply or provider text is retained</text><path d="M 680 146 L 680 164" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><path d="M 680 260 L 680 300" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="688.35" y="263.0" width="87.3" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="732.0" y="274.0" text-anchor="middle" font-size="10.5" fill="#e3c558">rows + scores</text><rect x="830" y="300" width="190" height="110" rx="9" fill="#24352f" stroke="#a9b8b0" stroke-width="1.6"/><text x="925.0" y="320" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Pick the model</text><text x="925.0" y="336" text-anchor="middle" font-size="11" fill="#a9b8b0">reject unsafe first:</text><text x="925.0" y="350" text-anchor="middle" font-size="11" fill="#a9b8b0">false found on absent rows</text><text x="925.0" y="364" text-anchor="middle" font-size="11" fill="#a9b8b0">then speed and cost</text><text x="925.0" y="378" text-anchor="middle" font-size="11" fill="#a9b8b0">among the acceptable</text><path d="M 790 355 L 830 355" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="830" y="440" width="190" height="50" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="925.0" y="457" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">FEEL_CHALK_MODEL</text><text x="925.0" y="473" text-anchor="middle" font-size="11" fill="#a9b8b0">the phone and both runs read it</text><path d="M 925 410 L 925 440" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M 830 465 L 130 465" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="332.65" y="446.0" width="294.7" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="480.0" y="457.0" text-anchor="middle" font-size="10.5" fill="#a9b8b0">a prompt or model change reruns the same labels</text><path d="M 130 465 L 130 230" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#muted)"/><text x="20" y="508" text-anchor="start" font-size="10.5" font-style="italic" fill="#a9b8b0">Execution success is not a quality pass: the report says NOT_ASSESSED until a person reads the scores. Synthetic rows prove the pipeline, not a model.</text></svg>
