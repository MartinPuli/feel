<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-label="Labeled photos pass a local preflight, run either locally through the gateway or as a hosted Chalk evaluation with three scorers, and produce one report with per-metric denominators that selects the gateway model." font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>The evaluation loop: identical inputs, explicit denominators, a model picked by evidence</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5fd9"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5a1f"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7f6a"/></marker></defs><rect x="0" y="0" width="1040" height="520" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="800" fill="#1b1b1b">The evaluation loop: identical inputs, explicit denominators, a model picked by evidence</text><rect x="20" y="70" width="230" height="70" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="135.0" y="89" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Consented photos + labels</text><text x="135.0" y="104" text-anchor="middle" font-size="11" fill="#1b1b1b">labels.jsonl: image, question, box</text><text x="135.0" y="118" text-anchor="middle" font-size="11" fill="#1b1b1b">at least one third absent</text><rect x="20" y="160" width="230" height="70" rx="7" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4"/><text x="135.0" y="179" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Synthetic set</text><text x="135.0" y="194" text-anchor="middle" font-size="11" fill="#1b1b1b">evals/make_synthetic.py</text><text x="135.0" y="208" text-anchor="middle" font-size="11" fill="#1b1b1b">EXIT signs and doors on walls</text><rect x="290" y="100" width="240" height="100" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="410.0" y="119" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Preflight, no cloud</text><text x="410.0" y="134" text-anchor="middle" font-size="11" fill="#1b1b1b">validate labels, confine image paths</text><text x="410.0" y="148" text-anchor="middle" font-size="11" fill="#1b1b1b">re-encode as the phone does (≤ 1024 px, q 0.6)</text><text x="410.0" y="162" text-anchor="middle" font-size="11" fill="#1b1b1b">SHA-256 of dataset and prompt</text><path d="M 250 105 L 290 140" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 250 195 L 290 160" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><rect x="570" y="70" width="220" height="76" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="680.0" y="89" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Local run  --local</text><text x="680.0" y="104" text-anchor="middle" font-size="11" fill="#1b1b1b">task + scorers on this Mac</text><text x="680.0" y="118" text-anchor="middle" font-size="11" fill="#1b1b1b">each row through the gateway</text><rect x="570" y="164" width="220" height="96" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="680.0" y="183" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Hosted run</text><text x="680.0" y="198" text-anchor="middle" font-size="11" fill="#1b1b1b">upload dataset · deploy task</text><text x="680.0" y="212" text-anchor="middle" font-size="11" fill="#1b1b1b">and scorers · evaluation run</text><text x="680.0" y="226" text-anchor="middle" font-size="11" fill="#1b1b1b">result dataset by run ID</text><path d="M 530 140 L 570 108" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 530 160 L 570 212" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="830" y="70" width="190" height="190" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="925.0" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Three scorers</text><text x="925.0" y="101" text-anchor="middle" font-size="11" fill="#1b1b1b">points_correctly</text><text x="925.0" y="115" text-anchor="middle" font-size="11" fill="#1b1b1b">box centre inside the label,</text><text x="925.0" y="129" text-anchor="middle" font-size="11" fill="#1b1b1b">or absent and "not found"</text><text x="925.0" y="143" text-anchor="middle" font-size="11" fill="#1b1b1b"></text><text x="925.0" y="157" text-anchor="middle" font-size="11" fill="#1b1b1b">reply_is_well_formed</text><text x="925.0" y="171" text-anchor="middle" font-size="11" fill="#1b1b1b">obeys the JSON contract</text><text x="925.0" y="185" text-anchor="middle" font-size="11" fill="#1b1b1b"></text><text x="925.0" y="199" text-anchor="middle" font-size="11" fill="#1b1b1b">false_found</text><text x="925.0" y="213" text-anchor="middle" font-size="11" fill="#1b1b1b">absent, yet claimed seen</text><path d="M 790 108 L 830 108" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 790 212 L 830 212" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="290" y="300" width="500" height="110" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="540.0" y="319" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">One report shape for both runs</text><text x="540.0" y="334" text-anchor="middle" font-size="11" fill="#1b1b1b">present localization · absent accuracy · false found · well-formed · missing response,</text><text x="540.0" y="348" text-anchor="middle" font-size="11" fill="#1b1b1b">each as numerator / denominator</text><text x="540.0" y="362" text-anchor="middle" font-size="11" fill="#1b1b1b">latency p50 · p95 · max, token usage, resolved model, run and dataset IDs</text><text x="540.0" y="376" text-anchor="middle" font-size="11" fill="#1b1b1b">no photo, question, reply or provider text is retained</text><path d="M 680 146 L 680 164" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 680 260 L 680 300" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="688.35" y="263.0" width="87.3" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="732.0" y="274.0" text-anchor="middle" font-size="10.5" fill="#2b5fd9">rows + scores</text><rect x="830" y="300" width="190" height="110" rx="7" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4"/><text x="925.0" y="319" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Pick the model</text><text x="925.0" y="334" text-anchor="middle" font-size="11" fill="#1b1b1b">reject unsafe first:</text><text x="925.0" y="348" text-anchor="middle" font-size="11" fill="#1b1b1b">false found on absent rows</text><text x="925.0" y="362" text-anchor="middle" font-size="11" fill="#1b1b1b">then speed and cost</text><text x="925.0" y="376" text-anchor="middle" font-size="11" fill="#1b1b1b">among the acceptable</text><path d="M 790 355 L 830 355" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><rect x="830" y="440" width="190" height="50" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="925.0" y="456" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">FEEL_CHALK_MODEL</text><text x="925.0" y="471" text-anchor="middle" font-size="11" fill="#1b1b1b">the phone and both runs read it</text><path d="M 925 410 L 925 440" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 830 465 L 130 465" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="332.65" y="446.0" width="294.7" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="480.0" y="457.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b">a prompt or model change reruns the same labels</text><path d="M 130 465 L 130 230" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><text x="20" y="508" text-anchor="start" font-size="10.5" font-style="italic" fill="#6b6b6b">Execution success is not a quality pass: the report says NOT_ASSESSED until a person reads the scores. Synthetic rows prove the pipeline, not a model.</text></svg>
