<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" width="1100" height="590" role="img" aria-label="With a printed tag in view, the floor grid a session learned is exported into the tag frame when sensing stops or tracking resets and kept per tag as one visit; the first sighting of the tag on a later visit seeds the planner with the per-cell merge of the stored visits, so route arrows can head for a remembered place before the camera has seen the room, while live observations override the prior cell by cell and the pins read only live depth. Chalk merges shared visits by the same vote." font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Room structure memory: the floor grid a visit learned comes back as a prior for the route planner</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5fd9"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5a1f"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7f6a"/></marker></defs><rect x="0" y="0" width="1100" height="590" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="800" fill="#1b1b1b">Room structure memory: the floor grid a visit learned comes back as a prior for the route planner</text><rect x="20" y="70" width="680" height="480" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3 4"/><text x="30" y="64" font-size="11.5" font-weight="700" fill="#6b6b6b" letter-spacing="0.6">PHONE</text><rect x="40" y="90" width="200" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="140.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Floor grid, this session</text><text x="140.0" y="124" text-anchor="middle" font-size="11" fill="#1b1b1b">LiDAR points → 10 cm cells</text><text x="140.0" y="138" text-anchor="middle" font-size="11" fill="#1b1b1b">free · blocked · unknown</text><text x="140.0" y="152" text-anchor="middle" font-size="11" fill="#1b1b1b">A* routes for the arrows</text><rect x="270" y="90" width="200" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="370.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Stop or tracking reset</text><text x="370.0" y="124" text-anchor="middle" font-size="11" fill="#1b1b1b">the grid is about to go:</text><text x="370.0" y="138" text-anchor="middle" font-size="11" fill="#1b1b1b">export the cells seen into</text><text x="370.0" y="152" text-anchor="middle" font-size="11" fill="#1b1b1b">the tag's levelled frame</text><rect x="500" y="90" width="180" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="590.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Visit map (RoomMap)</text><text x="590.0" y="124" text-anchor="middle" font-size="11" fill="#1b1b1b">cell size · origin · size</text><text x="590.0" y="138" text-anchor="middle" font-size="11" fill="#1b1b1b">cells 28f2b10f2u6b…</text><text x="590.0" y="152" text-anchor="middle" font-size="11" fill="#1b1b1b">newest 10 per tag on disk</text><path d="M 240 133 L 270 133" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 470 133 L 500 133" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><rect x="40" y="230" width="200" height="86" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="140.0" y="249" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Next visit: tag seen</text><text x="140.0" y="264" text-anchor="middle" font-size="11" fill="#1b1b1b">first sighting in this world</text><text x="140.0" y="278" text-anchor="middle" font-size="11" fill="#1b1b1b">ARKit image detection</text><text x="140.0" y="292" text-anchor="middle" font-size="11" fill="#1b1b1b">frame bound to the world</text><rect x="270" y="230" width="200" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="370.0" y="249" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Merge of the visits</text><text x="370.0" y="264" text-anchor="middle" font-size="11" fill="#1b1b1b">per cell: blocked when ≥ half</text><text x="370.0" y="278" text-anchor="middle" font-size="11" fill="#1b1b1b">of the visits that saw it did,</text><text x="370.0" y="292" text-anchor="middle" font-size="11" fill="#1b1b1b">free otherwise, else unknown</text><rect x="500" y="230" width="180" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="590.0" y="249" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Prior in the new grid</text><text x="590.0" y="264" text-anchor="middle" font-size="11" fill="#1b1b1b">fills cells the camera has</text><text x="590.0" y="278" text-anchor="middle" font-size="11" fill="#1b1b1b">not classified yet; every live</text><text x="590.0" y="292" text-anchor="middle" font-size="11" fill="#1b1b1b">classification overrides it</text><path d="M 240 273 L 270 273" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 470 273 L 500 273" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 590 176 L 590 203 L 370 203 L 370 230" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#muted)"/><rect x="326.35" y="186" width="87.3" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="370" y="197" text-anchor="middle" font-size="10.5" fill="#6b6b6b">stored visits</text><rect x="40" y="370" width="320" height="100" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="200.0" y="389" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Arrows before the room is seen</text><text x="200.0" y="404" text-anchor="middle" font-size="11" fill="#1b1b1b">"where is the exit": remembered anchor → route goal</text><text x="200.0" y="418" text-anchor="middle" font-size="11" fill="#1b1b1b">A* around remembered walls → one arrow,</text><text x="200.0" y="432" text-anchor="middle" font-size="11" fill="#1b1b1b">a suggested direction, never a clear path</text><text x="200.0" y="446" text-anchor="middle" font-size="11" fill="#1b1b1b">a tracking reset drops prior and goal together</text><path d="M 590 316 L 590 343 L 200 343 L 200 370" fill="none" stroke="#ff5a1f" stroke-width="1.6" marker-end="url(#accent)"/><rect x="390" y="370" width="290" height="100" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="535.0" y="386" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">get_status: room_structure</text><text x="535.0" y="401" text-anchor="middle" font-size="11" fill="#1b1b1b">tag · visits · cells · blocked · seeded</text><text x="535.0" y="415" text-anchor="middle" font-size="11" fill="#1b1b1b">a session counts as a visit only after</text><text x="535.0" y="429" text-anchor="middle" font-size="11" fill="#1b1b1b">the camera classified 20 cells</text><text x="535.0" y="443" text-anchor="middle" font-size="11" fill="#1b1b1b">live depth drives the pins; memory seeds routes</text><text x="40" y="505" text-anchor="start" font-size="10.5" font-style="italic" fill="#6b6b6b">A different print size or a tag lying flat gives no map: the frame must be upright on a wall (RoomFrame.levelled), 20 cm wide as drawn.</text><rect x="740" y="70" width="340" height="480" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3 4"/><text x="750" y="64" font-size="11.5" font-weight="700" fill="#6b6b6b" letter-spacing="0.6">CHALK: SHARED STRUCTURE</text><rect x="760" y="90" width="300" height="70" rx="7" fill="#f1f1f4" stroke="#7a7a8c" stroke-width="1.4"/><text x="910.0" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">room_maps table</text><text x="910.0" y="121" text-anchor="middle" font-size="11" fill="#1b1b1b">Supabase Postgres, shared = true only</text><text x="910.0" y="135" text-anchor="middle" font-size="11" fill="#1b1b1b">user · venue · tag · cell size · origin · cells</text><rect x="760" y="190" width="300" height="100" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="910.0" y="206" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">RoomMap → RoomMemory.structure</text><text x="910.0" y="221" text-anchor="middle" font-size="11" fill="#1b1b1b">key "&lt;venue&gt;:&lt;tag&gt;", newest 50 visits</text><text x="910.0" y="235" text-anchor="middle" font-size="11" fill="#1b1b1b">the same per-cell vote as the phone</text><text x="910.0" y="249" text-anchor="middle" font-size="11" fill="#1b1b1b">feel_chalk/room_map.py</text><text x="910.0" y="263" text-anchor="middle" font-size="11" fill="#1b1b1b">protocol/room-map-v1.json pins both</text><rect x="760" y="320" width="300" height="54" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="910.0" y="336" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Named query room_structure</text><text x="910.0" y="351" text-anchor="middle" font-size="11" fill="#1b1b1b">structure · structure_visits</text><rect x="760" y="404" width="300" height="86" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="910.0" y="420" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">context.py room-structure</text><text x="910.0" y="435" text-anchor="middle" font-size="11" fill="#1b1b1b">"8 x 6 cells of 0.1 m, 46 remembered</text><text x="910.0" y="449" text-anchor="middle" font-size="11" fill="#1b1b1b">(38 free, 8 blocked), merged from 3 visits."</text><text x="910.0" y="463" text-anchor="middle" font-size="11" fill="#1b1b1b">writes the merged map as JSON</text><path d="M 910 160 L 910 190" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 910 290 L 910 320" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 910 374 L 910 404" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><path d="M 680 112 L 760 112" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><path d="M 760 347 L 720 347" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><path d="M 720 347 L 720 273 L 680 273" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><text x="20" y="564" text-anchor="start" font-size="10.5" font-style="italic" fill="#6b6b6b">Dashed arrows are not wired yet: the upload of a visit (RoomMemory.shareStructure) and the download of the merged map (RoomMemory.fetchSharedStructure). No device test yet.</text><text x="20" y="582" text-anchor="start" font-size="10.5" font-style="italic" fill="#ff5a1f">The pins always come from live depth. A remembered wall is only a reason for the planner to prefer another way; what the camera sees this session wins cell by cell.</text></svg>
