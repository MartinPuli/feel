<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" width="1140" height="600" role="img" aria-label="FEEL system: the LiDAR phone drives the tactile puck directly; the assistant reaches OpenAI for voice and Chalk for the vision gateway, context features and evaluations." font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>FEEL at a glance: what runs on the body, on the phone, and through Chalk</title><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fbfe8"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3c558"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a25a"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b8b0"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9db3aa"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#e3c558" stroke-width="1.2" opacity="0.45"/></pattern><radialGradient id="board" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2b4039"/><stop offset="1" stop-color="#24352f"/></radialGradient></defs><rect x="0" y="0" width="1140" height="600" rx="18" fill="url(#board)"/><text x="20" y="30" font-size="16" font-weight="700" fill="#e9ece7">FEEL at a glance: what runs on the body, on the phone, and through Chalk</text><rect x="20" y="70" width="250" height="500" rx="12" fill="none" stroke="#a9b8b0" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/><text x="30" y="63" font-size="11.5" font-weight="700" fill="#a9b8b0" letter-spacing="1">ON THE BODY</text><rect x="40" y="288" width="210" height="86" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="145.0" y="308" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">iPhone, chest-mounted</text><text x="145.0" y="324" text-anchor="middle" font-size="11" fill="#a9b8b0">LiDAR depth 60 Hz · camera</text><text x="145.0" y="338" text-anchor="middle" font-size="11" fill="#a9b8b0">microphone · ARKit pose</text><rect x="40" y="452" width="210" height="86" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="145.0" y="472" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">FEEL puck</text><text x="145.0" y="488" text-anchor="middle" font-size="11" fill="#a9b8b0">ESP32 · BLE · six servos</text><text x="145.0" y="502" text-anchor="middle" font-size="11" fill="#a9b8b0">6 columns × 4 rows of pins</text><path d="M 250 331 L 320 331" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="244.4" y="312.0" width="81.19999999999999" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="285.0" y="323.0" text-anchor="middle" font-size="10.5" fill="#8fbfe8">depth + pose</text><path d="M 320 352 L 285 352 L 285 495 L 250 495" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="94.75" y="412" width="160.5" height="30" rx="3" fill="#24352f" opacity="0.92"/><text x="175" y="423" text-anchor="middle" font-size="10.5" fill="#8fbfe8">9-byte packet, 10 Hz, BLE</text><text x="175" y="436" text-anchor="middle" font-size="10.5" fill="#8fbfe8">neutral when unsure</text><rect x="300" y="70" width="330" height="500" rx="12" fill="none" stroke="#a9b8b0" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/><text x="310" y="63" font-size="11.5" font-weight="700" fill="#a9b8b0" letter-spacing="1">ON THE PHONE, ALWAYS</text><rect x="320" y="90" width="290" height="72" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="465.0" y="110" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Assistant tools</text><text x="465.0" y="126" text-anchor="middle" font-size="11" fill="#a9b8b0">find_target · where_is · venue_info</text><text x="465.0" y="140" text-anchor="middle" font-size="11" fill="#a9b8b0">start_directions · get_status · stop</text><rect x="320" y="182" width="290" height="86" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="465.0" y="202" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Local detectors</text><text x="465.0" y="218" text-anchor="middle" font-size="11" fill="#a9b8b0">EXIT text · door shapes · people</text><text x="465.0" y="232" text-anchor="middle" font-size="11" fill="#a9b8b0">Core ML objects · hand signs</text><text x="465.0" y="246" text-anchor="middle" font-size="11" fill="#a9b8b0">the Where-is fallback</text><rect x="320" y="288" width="290" height="86" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="465.0" y="308" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Depth to pins</text><text x="465.0" y="324" text-anchor="middle" font-size="11" fill="#a9b8b0">floor-calibrated samples → 6 sectors</text><text x="465.0" y="338" text-anchor="middle" font-size="11" fill="#a9b8b0">nearest range → 4 distance rows</text><text x="465.0" y="352" text-anchor="middle" font-size="11" fill="#a9b8b0">open side: which way has more room</text><rect x="320" y="394" width="290" height="86" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="465.0" y="414" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Offline stores</text><text x="465.0" y="430" text-anchor="middle" font-size="11" fill="#a9b8b0">venue pack (hashed, expiring)</text><text x="465.0" y="444" text-anchor="middle" font-size="11" fill="#a9b8b0">floor grid + route arrows</text><text x="465.0" y="458" text-anchor="middle" font-size="11" fill="#a9b8b0">confirmed finds (pending)</text><rect x="660" y="70" width="460" height="500" rx="12" fill="none" stroke="#a9b8b0" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/><text x="670" y="63" font-size="11.5" font-weight="700" fill="#a9b8b0" letter-spacing="1">WHEN CONNECTED</text><rect x="680" y="90" width="240" height="72" rx="9" fill="#1a2b26" stroke="#8e9aa6" stroke-width="1.6"/><text x="800.0" y="110" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">OpenAI Realtime</text><text x="800.0" y="126" text-anchor="middle" font-size="11" fill="#a9b8b0">voice in and out, direct;</text><text x="800.0" y="140" text-anchor="middle" font-size="11" fill="#a9b8b0">tool calls return to the phone</text><rect x="685" y="187" width="240" height="86" rx="9" fill="url(#hatch)"/><rect x="680" y="182" width="240" height="86" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="800.0" y="202" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Chalk Model Gateway</text><text x="800.0" y="218" text-anchor="middle" font-size="11" fill="#a9b8b0">vision model, restricted key</text><text x="800.0" y="232" text-anchor="middle" font-size="11" fill="#a9b8b0">one photo + question → {found, box}</text><text x="800.0" y="246" text-anchor="middle" font-size="11" fill="#a9b8b0">trace content logging off</text><rect x="945" y="187" width="160" height="86" rx="9" fill="url(#hatch)"/><rect x="940" y="182" width="160" height="86" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="1020.0" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Chalk evaluations</text><text x="1020.0" y="215" text-anchor="middle" font-size="11" fill="#a9b8b0">task + 3 scorers</text><text x="1020.0" y="229" text-anchor="middle" font-size="11" fill="#a9b8b0">metrics with denominators</text><text x="1020.0" y="243" text-anchor="middle" font-size="11" fill="#a9b8b0">local or hosted runs</text><rect x="685" y="305" width="240" height="100" rx="9" fill="url(#hatch)"/><rect x="680" y="300" width="240" height="100" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="800.0" y="317" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Chalk features</text><text x="800.0" y="333" text-anchor="middle" font-size="11" fill="#a9b8b0">ObjectHistory: last confirmed find,</text><text x="800.0" y="347" text-anchor="middle" font-size="11" fill="#a9b8b0">the sentence to say</text><text x="800.0" y="361" text-anchor="middle" font-size="11" fill="#a9b8b0">Venue: pack from reviewed rows</text><text x="800.0" y="375" text-anchor="middle" font-size="11" fill="#a9b8b0">named queries last_seen · venue_pack</text><rect x="940" y="312" width="160" height="76" rx="9" fill="#1a2b26" stroke="#8e9aa6" stroke-width="1.6"/><text x="1020.0" y="329" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Postgres</text><text x="1020.0" y="345" text-anchor="middle" font-size="11" fill="#a9b8b0">Supabase</text><text x="1020.0" y="359" text-anchor="middle" font-size="11" fill="#a9b8b0">confirmed_finds · venues</text><path d="M 610 126 L 680 126" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted)"/><rect x="586.1" y="107.0" width="117.8" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="645.0" y="118.0" text-anchor="middle" font-size="10.5" fill="#a9b8b0">audio + tool calls</text><path d="M 610 214 L 680 214" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="598.3" y="195.0" width="93.39999999999999" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="645.0" y="206.0" text-anchor="middle" font-size="10.5" fill="#e3c558">JPEG ≤ 1024 px</text><path d="M 680 246 L 610 246" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="573.9" y="251.0" width="142.2" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="645.0" y="262.0" text-anchor="middle" font-size="10.5" fill="#e3c558">box or not found, 12 s</text><path d="M 940 225 L 920 225" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#chalk)"/><rect x="880.25" y="204.0" width="99.5" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="930.0" y="215.0" text-anchor="middle" font-size="10.5" fill="#e3c558">picks the model</text><path d="M 940 350 L 920 350" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="892.45" y="331.0" width="75.1" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="930.0" y="342.0" text-anchor="middle" font-size="10.5" fill="#e3c558">data source</text><path d="M 680 372 L 645 372 L 645 437 L 610 437" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="595.25" y="418" width="99.5" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="645" y="429" text-anchor="middle" font-size="10.5" fill="#e3c558">sentence · pack</text><path d="M 610 460 L 1020 460 L 1020 460" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted)"/><rect x="912.3" y="441" width="215.39999999999998" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="1020" y="452" text-anchor="middle" font-size="10.5" fill="#a9b8b0">"found it" → REST insert, user JWT</text><path d="M 1020 460 L 1020 388" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted)"/><text x="20" y="590" text-anchor="start" font-size="10.5" font-style="italic" fill="#a9b8b0">Solid arrows exist in the repository and run against the live database. The dashed one is inside the gateway. Pins never come from the cloud.</text></svg>
