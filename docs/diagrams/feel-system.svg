<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" width="1140" height="600" role="img" aria-label="FEEL system: the LiDAR phone drives the tactile puck directly; the assistant reaches OpenAI for voice and Chalk for the vision gateway, context features and evaluations." font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>FEEL at a glance: what runs on the body, on the phone, and through Chalk</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5fd9"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5a1f"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7f6a"/></marker></defs><rect x="0" y="0" width="1140" height="600" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="800" fill="#1b1b1b">FEEL at a glance: what runs on the body, on the phone, and through Chalk</text><rect x="20" y="70" width="250" height="500" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3 4"/><text x="30" y="64" font-size="11.5" font-weight="700" fill="#6b6b6b" letter-spacing="0.6">ON THE BODY</text><rect x="40" y="288" width="210" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="145.0" y="307" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">iPhone, chest-mounted</text><text x="145.0" y="322" text-anchor="middle" font-size="11" fill="#1b1b1b">LiDAR depth 60 Hz · camera</text><text x="145.0" y="336" text-anchor="middle" font-size="11" fill="#1b1b1b">microphone · ARKit pose</text><rect x="40" y="452" width="210" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="145.0" y="471" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">FEEL puck</text><text x="145.0" y="486" text-anchor="middle" font-size="11" fill="#1b1b1b">ESP32 · BLE · seven servos</text><text x="145.0" y="500" text-anchor="middle" font-size="11" fill="#1b1b1b">7 columns × 4 rows of pins</text><path d="M 250 331 L 320 331" fill="none" stroke="#8a7f6a" stroke-width="1.6" marker-end="url(#phone)"/><rect x="244.4" y="312.0" width="81.19999999999999" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="285.0" y="323.0" text-anchor="middle" font-size="10.5" fill="#8a7f6a">depth + pose</text><path d="M 320 352 L 285 352 L 285 495 L 250 495" fill="none" stroke="#8a7f6a" stroke-width="1.6" marker-end="url(#phone)"/><rect x="94.75" y="412" width="160.5" height="30" rx="3" fill="#ffffff" opacity="0.92"/><text x="175" y="423" text-anchor="middle" font-size="10.5" fill="#8a7f6a">9-byte packet, 10 Hz, BLE</text><text x="175" y="436" text-anchor="middle" font-size="10.5" fill="#8a7f6a">neutral when unsure</text><rect x="300" y="70" width="330" height="500" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3 4"/><text x="310" y="64" font-size="11.5" font-weight="700" fill="#6b6b6b" letter-spacing="0.6">ON THE PHONE, ALWAYS</text><rect x="320" y="90" width="290" height="72" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="465.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Assistant tools</text><text x="465.0" y="124" text-anchor="middle" font-size="11" fill="#1b1b1b">find_target · where_is · venue_info</text><text x="465.0" y="138" text-anchor="middle" font-size="11" fill="#1b1b1b">start_directions · get_status · stop</text><rect x="320" y="182" width="290" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="465.0" y="201" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Local detectors</text><text x="465.0" y="216" text-anchor="middle" font-size="11" fill="#1b1b1b">EXIT text · door shapes · people</text><text x="465.0" y="230" text-anchor="middle" font-size="11" fill="#1b1b1b">Core ML objects · hand signs</text><text x="465.0" y="244" text-anchor="middle" font-size="11" fill="#1b1b1b">the Where-is fallback</text><rect x="320" y="288" width="290" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="465.0" y="307" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Depth to pins</text><text x="465.0" y="322" text-anchor="middle" font-size="11" fill="#1b1b1b">floor-calibrated samples → 7 sectors</text><text x="465.0" y="336" text-anchor="middle" font-size="11" fill="#1b1b1b">nearest range → 4 distance rows</text><text x="465.0" y="350" text-anchor="middle" font-size="11" fill="#1b1b1b">open side: which way has more room</text><rect x="320" y="394" width="290" height="86" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="465.0" y="413" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Offline stores</text><text x="465.0" y="428" text-anchor="middle" font-size="11" fill="#1b1b1b">venue pack (hashed, expiring)</text><text x="465.0" y="442" text-anchor="middle" font-size="11" fill="#1b1b1b">floor grid + route arrows</text><text x="465.0" y="456" text-anchor="middle" font-size="11" fill="#1b1b1b">confirmed finds (pending)</text><rect x="660" y="70" width="460" height="500" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3 4"/><text x="670" y="64" font-size="11.5" font-weight="700" fill="#6b6b6b" letter-spacing="0.6">WHEN CONNECTED</text><rect x="680" y="90" width="240" height="72" rx="7" fill="#f1f1f4" stroke="#7a7a8c" stroke-width="1.4"/><text x="800.0" y="109" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">OpenAI Realtime</text><text x="800.0" y="124" text-anchor="middle" font-size="11" fill="#1b1b1b">voice in and out, direct;</text><text x="800.0" y="138" text-anchor="middle" font-size="11" fill="#1b1b1b">tool calls return to the phone</text><rect x="680" y="182" width="240" height="86" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="800.0" y="201" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Chalk Model Gateway</text><text x="800.0" y="216" text-anchor="middle" font-size="11" fill="#1b1b1b">vision model, restricted key</text><text x="800.0" y="230" text-anchor="middle" font-size="11" fill="#1b1b1b">one photo + question → {found, box}</text><text x="800.0" y="244" text-anchor="middle" font-size="11" fill="#1b1b1b">trace content logging off</text><rect x="940" y="182" width="160" height="86" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="1020.0" y="198" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Chalk evaluations</text><text x="1020.0" y="213" text-anchor="middle" font-size="11" fill="#1b1b1b">task + 3 scorers</text><text x="1020.0" y="227" text-anchor="middle" font-size="11" fill="#1b1b1b">metrics with denominators</text><text x="1020.0" y="241" text-anchor="middle" font-size="11" fill="#1b1b1b">local or hosted runs</text><rect x="680" y="300" width="240" height="100" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="800.0" y="316" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Chalk features</text><text x="800.0" y="331" text-anchor="middle" font-size="11" fill="#1b1b1b">ObjectHistory: last confirmed find,</text><text x="800.0" y="345" text-anchor="middle" font-size="11" fill="#1b1b1b">the sentence to say</text><text x="800.0" y="359" text-anchor="middle" font-size="11" fill="#1b1b1b">Venue: pack from reviewed rows</text><text x="800.0" y="373" text-anchor="middle" font-size="11" fill="#1b1b1b">named queries last_seen · venue_pack</text><rect x="940" y="312" width="160" height="76" rx="7" fill="#f1f1f4" stroke="#7a7a8c" stroke-width="1.4"/><text x="1020.0" y="328" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Postgres</text><text x="1020.0" y="343" text-anchor="middle" font-size="11" fill="#1b1b1b">Supabase</text><text x="1020.0" y="357" text-anchor="middle" font-size="11" fill="#1b1b1b">confirmed_finds · venues</text><path d="M 610 126 L 680 126" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#muted)"/><rect x="586.1" y="107.0" width="117.8" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="645.0" y="118.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b">audio + tool calls</text><path d="M 610 214 L 680 214" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="598.3" y="195.0" width="93.39999999999999" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="645.0" y="206.0" text-anchor="middle" font-size="10.5" fill="#2b5fd9">JPEG ≤ 1024 px</text><path d="M 680 246 L 610 246" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="573.9" y="251.0" width="142.2" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="645.0" y="262.0" text-anchor="middle" font-size="10.5" fill="#2b5fd9">box or not found, 12 s</text><path d="M 940 225 L 920 225" fill="none" stroke="#2b5fd9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#chalk)"/><rect x="880.25" y="204.0" width="99.5" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="930.0" y="215.0" text-anchor="middle" font-size="10.5" fill="#2b5fd9">picks the model</text><path d="M 940 350 L 920 350" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="892.45" y="331.0" width="75.1" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="930.0" y="342.0" text-anchor="middle" font-size="10.5" fill="#2b5fd9">data source</text><path d="M 680 372 L 645 372 L 645 437 L 610 437" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="595.25" y="418" width="99.5" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="645" y="429" text-anchor="middle" font-size="10.5" fill="#2b5fd9">sentence · pack</text><path d="M 610 460 L 1020 460 L 1020 460" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#muted)"/><rect x="912.3" y="441" width="215.39999999999998" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="1020" y="452" text-anchor="middle" font-size="10.5" fill="#6b6b6b">"found it" → REST insert, user JWT</text><path d="M 1020 460 L 1020 388" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#muted)"/><text x="20" y="590" text-anchor="start" font-size="10.5" font-style="italic" fill="#6b6b6b">Solid arrows exist in the repository and run against the live database. The dashed one is inside the gateway. Pins never come from the cloud.</text></svg>
