<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-label="Three short stories: a photo question answered through the Chalk Model Gateway and shown on the pins; a confirmed find kept in Chalk memory and answered on the next visit; every model or prompt change scored by Chalk evaluations before it goes live. Obstacles are sensed on the phone alone." font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>What Chalk does for the app</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5fd9"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5a1f"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7f6a"/></marker></defs><rect x="0" y="0" width="1040" height="420" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="800" fill="#1b1b1b">What Chalk does for the app</text><rect x="20" y="70" width="320" height="62" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="180.0" y="89" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">"Where is the water fountain?"</text><text x="180.0" y="104" text-anchor="middle" font-size="11" fill="#1b1b1b">one photo from the phone on the chest</text><path d="M 180 132 L 180 180" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><rect x="20" y="180" width="320" height="76" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="180.0" y="199" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Chalk Model Gateway</text><text x="180.0" y="214" text-anchor="middle" font-size="11" fill="#1b1b1b">a vision model finds it</text><text x="180.0" y="228" text-anchor="middle" font-size="11" fill="#1b1b1b">in the photo</text><path d="M 180 256 L 180 304" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="20" y="304" width="320" height="66" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="180.0" y="323" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Pins point the way</text><rect x="370" y="70" width="320" height="62" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="530.0" y="89" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">"Found it"</text><text x="530.0" y="104" text-anchor="middle" font-size="11" fill="#1b1b1b">the user confirms</text><path d="M 530 132 L 530 180" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><rect x="370" y="180" width="320" height="76" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="530.0" y="199" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Chalk Memory</text><text x="530.0" y="214" text-anchor="middle" font-size="11" fill="#1b1b1b">remembers where things were</text><text x="530.0" y="228" text-anchor="middle" font-size="11" fill="#1b1b1b">and when</text><path d="M 530 256 L 530 304" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="370" y="304" width="320" height="66" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="530.0" y="323" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Next visit</text><text x="530.0" y="338" text-anchor="middle" font-size="11" fill="#1b1b1b">"Last seen here, 2 hours ago."</text><text x="530.0" y="352" text-anchor="middle" font-size="11" fill="#1b1b1b">pins point there at once</text><rect x="720" y="70" width="320" height="62" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="880.0" y="89" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Every change</text><text x="880.0" y="104" text-anchor="middle" font-size="11" fill="#1b1b1b">same photos, same questions</text><path d="M 880 132 L 880 180" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><rect x="720" y="180" width="320" height="76" rx="7" fill="#e8f0fe" stroke="#2b5fd9" stroke-width="1.4"/><text x="880.0" y="199" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Chalk Evals</text><text x="880.0" y="214" text-anchor="middle" font-size="11" fill="#1b1b1b">scores each model and prompt</text><text x="880.0" y="228" text-anchor="middle" font-size="11" fill="#1b1b1b">misses and false finds first</text><path d="M 880 256 L 880 304" fill="none" stroke="#2b5fd9" stroke-width="1.6" marker-end="url(#chalk)"/><rect x="720" y="304" width="320" height="66" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="880.0" y="323" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">The better one goes live</text><text x="20" y="404" text-anchor="start" font-size="11" font-style="italic" fill="#6b6b6b">Obstacles are sensed on the phone alone; nothing from Chalk ever drives the pins directly.</text></svg>
