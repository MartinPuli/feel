<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-label="Three short stories: a photo question answered through the Chalk Model Gateway and shown on the pins; a confirmed find kept in Chalk memory and answered on the next visit; every model or prompt change scored by Chalk evaluations before it goes live. Obstacles are sensed on the phone alone." font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>What Chalk does for the app</title><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fbfe8"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3c558"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a25a"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b8b0"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9db3aa"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#e3c558" stroke-width="1.2" opacity="0.45"/></pattern><radialGradient id="board" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2b4039"/><stop offset="1" stop-color="#24352f"/></radialGradient></defs><rect x="0" y="0" width="1040" height="420" rx="18" fill="url(#board)"/><text x="20" y="30" font-size="16" font-weight="700" fill="#e9ece7">What Chalk does for the app</text><rect x="20" y="70" width="320" height="62" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="180.0" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">"Where is the water fountain?"</text><text x="180.0" y="106" text-anchor="middle" font-size="11" fill="#a9b8b0">one photo from the phone on the chest</text><path d="M 180 132 L 180 180" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="25" y="185" width="320" height="76" rx="9" fill="url(#hatch)"/><rect x="20" y="180" width="320" height="76" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="180.0" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Chalk Model Gateway</text><text x="180.0" y="216" text-anchor="middle" font-size="11" fill="#a9b8b0">a vision model finds it</text><text x="180.0" y="230" text-anchor="middle" font-size="11" fill="#a9b8b0">in the photo</text><path d="M 180 256 L 180 304" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="20" y="304" width="320" height="66" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="180.0" y="324" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Pins point the way</text><rect x="370" y="70" width="320" height="62" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="530.0" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">"Found it"</text><text x="530.0" y="106" text-anchor="middle" font-size="11" fill="#a9b8b0">the user confirms</text><path d="M 530 132 L 530 180" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="375" y="185" width="320" height="76" rx="9" fill="url(#hatch)"/><rect x="370" y="180" width="320" height="76" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="530.0" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Chalk Memory</text><text x="530.0" y="216" text-anchor="middle" font-size="11" fill="#a9b8b0">remembers where things were</text><text x="530.0" y="230" text-anchor="middle" font-size="11" fill="#a9b8b0">and when</text><path d="M 530 256 L 530 304" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="370" y="304" width="320" height="66" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="530.0" y="324" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Next visit</text><text x="530.0" y="340" text-anchor="middle" font-size="11" fill="#a9b8b0">"Last seen here, 2 hours ago."</text><text x="530.0" y="354" text-anchor="middle" font-size="11" fill="#a9b8b0">pins point there at once</text><rect x="720" y="70" width="320" height="62" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="880.0" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Every change</text><text x="880.0" y="106" text-anchor="middle" font-size="11" fill="#a9b8b0">same photos, same questions</text><path d="M 880 132 L 880 180" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="725" y="185" width="320" height="76" rx="9" fill="url(#hatch)"/><rect x="720" y="180" width="320" height="76" rx="9" fill="#15231e" stroke="#e3c558" stroke-width="1.6"/><text x="880.0" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Chalk Evals</text><text x="880.0" y="216" text-anchor="middle" font-size="11" fill="#a9b8b0">scores each model and prompt</text><text x="880.0" y="230" text-anchor="middle" font-size="11" fill="#a9b8b0">misses and false finds first</text><path d="M 880 256 L 880 304" fill="none" stroke="#e3c558" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chalk)"/><rect x="720" y="304" width="320" height="66" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="880.0" y="324" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">The better one goes live</text><text x="20" y="404" text-anchor="start" font-size="11" font-style="italic" fill="#a9b8b0">Obstacles are sensed on the phone alone; nothing from Chalk ever drives the pins directly.</text></svg>
