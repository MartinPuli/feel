<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-label="LiDAR depth becomes seven sector ranges and four distance rows sent to the pins at 10 Hz; alongside, the open-side finder names which side has more room with hysteresis and urgency, and route arrows play as cues that close obstacles always override." font-family="'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Sensing to pins, with the open-side finder and the direction cues</title><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fbfe8"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3c558"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0a25a"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b8b0"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9db3aa"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#e3c558" stroke-width="1.2" opacity="0.45"/></pattern><radialGradient id="board" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2b4039"/><stop offset="1" stop-color="#24352f"/></radialGradient></defs><rect x="0" y="0" width="1040" height="470" rx="18" fill="url(#board)"/><text x="20" y="30" font-size="16" font-weight="700" fill="#e9ece7">Sensing to pins, with the open-side finder and the direction cues</text><rect x="20" y="80" width="150" height="76" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="95.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">LiDAR depth</text><text x="95.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">ARKit sceneDepth</text><text x="95.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">with confidence</text><rect x="190" y="80" width="170" height="76" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="275.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Floor-calibrated samples</text><text x="275.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">measured camera height</text><text x="275.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">keep 0.6 to 2.1 m above floor</text><rect x="380" y="80" width="170" height="76" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="465.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Seven sectors</text><text x="465.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">nearest range per 12.9°</text><text x="465.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">unknown stays unknown</text><rect x="570" y="80" width="170" height="76" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="655.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Four rows</text><text x="655.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">&lt; 0.9 · &lt; 1.6 · &lt; 2.5 · ≤ 4 m</text><text x="655.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">target column highlighted</text><rect x="760" y="80" width="120" height="76" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="820.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">9-byte packet</text><text x="820.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">sequence, bands,</text><text x="820.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">highlight</text><rect x="900" y="80" width="120" height="76" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="960.0" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Pins</text><text x="960.0" y="116" text-anchor="middle" font-size="11" fill="#a9b8b0">BLE, 10 Hz</text><text x="960.0" y="130" text-anchor="middle" font-size="11" fill="#a9b8b0">7 × 4</text><path d="M 170 118 L 190 118" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M 360 118 L 380 118" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M 550 118 L 570 118" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M 740 118 L 760 118" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M 880 118 L 900 118" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><text x="20" y="180" text-anchor="start" font-size="11" font-style="italic" fill="#f0a25a">The pins always come from live depth. Nothing below replaces them; cues are held back while any pin is within 0.9 m.</text><rect x="20" y="215" width="330" height="110" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="185.0" y="235" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Open-side finder, from the seven ranges</text><text x="185.0" y="251" text-anchor="middle" font-size="11" fill="#a9b8b0">width filter: a column has the room of its narrower neighbour</text><text x="185.0" y="265" text-anchor="middle" font-size="11" fill="#a9b8b0">smoothing 0.6 s · most room wins · 0.4 m switch margin</text><text x="185.0" y="279" text-anchor="middle" font-size="11" fill="#a9b8b0">urgency from the range ahead (1.6 m → 0.3 m)</text><text x="185.0" y="293" text-anchor="middle" font-size="11" fill="#a9b8b0">unknown never counts as room; the result is relative</text><path d="M 465 156 L 465 215" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M 350 270 L 390 270" fill="none" stroke="#8fbfe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="390" y="215" width="250" height="110" rx="9" fill="#15231e" stroke="#f0a25a" stroke-width="2.2"/><text x="515.0" y="235" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Says and taps</text><text x="515.0" y="251" text-anchor="middle" font-size="11" fill="#a9b8b0">"An obstacle was 0.8 meters ahead.</text><text x="515.0" y="265" text-anchor="middle" font-size="11" fill="#a9b8b0">More room to your left."</text><text x="515.0" y="279" text-anchor="middle" font-size="11" fill="#a9b8b0">one sweep cue toward that column</text><text x="515.0" y="293" text-anchor="middle" font-size="11" fill="#a9b8b0">(arrows on, nothing closer than 0.9 m)</text><rect x="680" y="215" width="340" height="110" rx="9" fill="#15231e" stroke="#9db3aa" stroke-width="1.6"/><text x="850.0" y="235" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e9ece7">Direction arrows</text><text x="850.0" y="251" text-anchor="middle" font-size="11" fill="#a9b8b0">floor grid from depth · A* route to the target</text><text x="850.0" y="265" text-anchor="middle" font-size="11" fill="#a9b8b0">DirectionCue: straight, bear, turn, arrived</text><text x="850.0" y="279" text-anchor="middle" font-size="11" fill="#a9b8b0">CuePlayer draws it on the pins for 100 ms per frame,</text><text x="850.0" y="293" text-anchor="middle" font-size="11" fill="#a9b8b0">holds while anything is within 0.9 m</text><path d="M 660 156 L 850 215" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted)"/><rect x="761.35" y="168.5" width="87.3" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="805.0" y="179.5" text-anchor="middle" font-size="10.5" fill="#a9b8b0">target + pose</text><path d="M 640 270 L 680 270" fill="none" stroke="#a9b8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="610.25" y="251.0" width="99.5" height="17" rx="3" fill="#24352f" opacity="0.92"/><text x="660.0" y="262.0" text-anchor="middle" font-size="10.5" fill="#a9b8b0">same cue player</text><rect x="20" y="350" width="1000" height="86" rx="9" fill="#24352f" stroke="#a9b8b0" stroke-width="1.6"/><text x="520.0" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#e9ece7">Where the inputs come from</text><text x="520.0" y="383" text-anchor="middle" font-size="11" fill="#a9b8b0">target: a finder (door, exit, chair, person, teammate) or a held Where-is result</text><text x="520.0" y="397" text-anchor="middle" font-size="11" fill="#a9b8b0">route goal: a Where-is target, two fingers on a column, or a V sign</text><text x="520.0" y="411" text-anchor="middle" font-size="11" fill="#a9b8b0">voice: notices are throttled and must still match the scene when spoken; muting keeps commands working</text><text x="20" y="458" text-anchor="start" font-size="10.5" font-style="italic" fill="#a9b8b0">Memory (Chalk) can shortcut the question, never the pins: a remembered target gives a direction to route toward, while the live rows show what is there now.</text></svg>
