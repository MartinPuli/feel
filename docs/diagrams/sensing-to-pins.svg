<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-label="LiDAR depth becomes seven sector ranges and four distance rows sent to the pins at 10 Hz; alongside, the open-side finder names which side has more room with hysteresis and urgency, and route arrows play as cues that close obstacles always override." font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Sensing to pins, with the open-side finder and the direction cues</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/></marker><marker id="chalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5fd9"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5a1f"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7f6a"/></marker></defs><rect x="0" y="0" width="1040" height="470" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="800" fill="#1b1b1b">Sensing to pins, with the open-side finder and the direction cues</text><rect x="20" y="80" width="150" height="76" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="95.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">LiDAR depth</text><text x="95.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">ARKit sceneDepth</text><text x="95.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">with confidence</text><rect x="190" y="80" width="170" height="76" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="275.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Floor-calibrated samples</text><text x="275.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">measured camera height</text><text x="275.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">keep 0.6 to 2.1 m above floor</text><rect x="380" y="80" width="170" height="76" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="465.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Seven sectors</text><text x="465.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">nearest range per 12.9°</text><text x="465.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">unknown stays unknown</text><rect x="570" y="80" width="170" height="76" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="655.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Four rows</text><text x="655.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">&lt; 0.9 · &lt; 1.6 · &lt; 2.5 · ≤ 4 m</text><text x="655.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">target column highlighted</text><rect x="760" y="80" width="120" height="76" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="820.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">9-byte packet</text><text x="820.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">sequence, bands,</text><text x="820.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">highlight</text><rect x="900" y="80" width="120" height="76" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="960.0" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Pins</text><text x="960.0" y="114" text-anchor="middle" font-size="11" fill="#1b1b1b">BLE, 10 Hz</text><text x="960.0" y="128" text-anchor="middle" font-size="11" fill="#1b1b1b">7 × 4</text><path d="M 170 118 L 190 118" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 360 118 L 380 118" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 550 118 L 570 118" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 740 118 L 760 118" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 880 118 L 900 118" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><text x="20" y="180" text-anchor="start" font-size="11" font-style="italic" fill="#ff5a1f">The pins always come from live depth. Nothing below replaces them; cues are held back while any pin is within 0.9 m.</text><rect x="20" y="215" width="330" height="110" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="185.0" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Open-side finder, from the seven ranges</text><text x="185.0" y="249" text-anchor="middle" font-size="11" fill="#1b1b1b">width filter: a column has the room of its narrower neighbour</text><text x="185.0" y="263" text-anchor="middle" font-size="11" fill="#1b1b1b">smoothing 0.6 s · most room wins · 0.4 m switch margin</text><text x="185.0" y="277" text-anchor="middle" font-size="11" fill="#1b1b1b">urgency from the range ahead (1.6 m → 0.3 m)</text><text x="185.0" y="291" text-anchor="middle" font-size="11" fill="#1b1b1b">unknown never counts as room; the result is relative</text><path d="M 465 156 L 465 215" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><path d="M 350 270 L 390 270" fill="none" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#ink)"/><rect x="390" y="215" width="250" height="110" rx="7" fill="#f3efe6" stroke="#ff5a1f" stroke-width="2.2"/><text x="515.0" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Says and taps</text><text x="515.0" y="249" text-anchor="middle" font-size="11" fill="#1b1b1b">"An obstacle was 0.8 meters ahead.</text><text x="515.0" y="263" text-anchor="middle" font-size="11" fill="#1b1b1b">More room to your left."</text><text x="515.0" y="277" text-anchor="middle" font-size="11" fill="#1b1b1b">one sweep cue toward that column</text><text x="515.0" y="291" text-anchor="middle" font-size="11" fill="#1b1b1b">(arrows on, nothing closer than 0.9 m)</text><rect x="680" y="215" width="340" height="110" rx="7" fill="#f3efe6" stroke="#8a7f6a" stroke-width="1.4"/><text x="850.0" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1b1b">Direction arrows</text><text x="850.0" y="249" text-anchor="middle" font-size="11" fill="#1b1b1b">floor grid from depth · A* route to the target</text><text x="850.0" y="263" text-anchor="middle" font-size="11" fill="#1b1b1b">DirectionCue: straight, bear, turn, arrived</text><text x="850.0" y="277" text-anchor="middle" font-size="11" fill="#1b1b1b">CuePlayer draws it on the pins for 100 ms per frame,</text><text x="850.0" y="291" text-anchor="middle" font-size="11" fill="#1b1b1b">holds while anything is within 0.9 m</text><path d="M 660 156 L 850 215" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#muted)"/><rect x="761.35" y="168.5" width="87.3" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="805.0" y="179.5" text-anchor="middle" font-size="10.5" fill="#6b6b6b">target + pose</text><path d="M 640 270 L 680 270" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#muted)"/><rect x="610.25" y="251.0" width="99.5" height="17" rx="3" fill="#ffffff" opacity="0.92"/><text x="660.0" y="262.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b">same cue player</text><rect x="20" y="350" width="1000" height="86" rx="7" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4"/><text x="520.0" y="366" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1b1b">Where the inputs come from</text><text x="520.0" y="381" text-anchor="middle" font-size="11" fill="#1b1b1b">target: a finder (door, exit, chair, person, teammate) or a held Where-is result</text><text x="520.0" y="395" text-anchor="middle" font-size="11" fill="#1b1b1b">route goal: a Where-is target, two fingers on a column, or a V sign</text><text x="520.0" y="409" text-anchor="middle" font-size="11" fill="#1b1b1b">voice: notices are throttled and must still match the scene when spoken; muting keeps commands working</text><text x="20" y="458" text-anchor="start" font-size="10.5" font-style="italic" fill="#6b6b6b">Memory (Chalk) can shortcut the question, never the pins: a remembered target gives a direction to route toward, while the live rows show what is there now.</text></svg>
