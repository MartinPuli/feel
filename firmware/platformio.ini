[platformio]
default_envs = esp32, esp32s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@2.3.6
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

[env:esp32]
board = esp32dev
build_flags = ${env.build_flags} -D FEEL_BOARD_CLASSIC

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D FEEL_BOARD_S3 -D ARDUINO_USB_CDC_ON_BOOT=1

; Software-only compile fixtures. These values ARE NOT hardware measurements.
; Not default environments; upload/program targets are explicitly rejected.
[env:esp32-compilecheck]
extends = env:esp32
extra_scripts = pre:tools/compile_only.py
build_flags =
    ${env:esp32.build_flags}
    -D FEEL_ENABLE_SERVO_OUTPUT=1
    -D FEEL_VERIFIED_PULSE_MIN_US=650
    -D FEEL_VERIFIED_PULSE_MAX_US=2500
    -D FEEL_COMPILE_ONLY_FIXTURE=1

[env:esp32s3-compilecheck]
extends = env:esp32s3
extra_scripts = pre:tools/compile_only.py
build_flags =
    ${env:esp32s3.build_flags}
    -D FEEL_ENABLE_SERVO_OUTPUT=1
    -D FEEL_VERIFIED_PULSE_MIN_US=650
    -D FEEL_VERIFIED_PULSE_MAX_US=2500
    -D FEEL_COMPILE_ONLY_FIXTURE=1

; Live iPhone integration for ONE unloaded servo on GPIO33.
; Uses center sector3 and the tested nominal1450..1550us neighborhood only.
; This is not the six-column cam mechanism or a measured-range build.
[env:esp32-single-demo]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -D FEEL_SINGLE_SERVO_DEMO=1

; Explicit opt-in: ONE servo on GPIO33 follows production center-sector pulses.
; Assumed650..2500us /175-degree assumption, NOT a measured-safe-range build.
; Defaults and the midpoint demo above remain unchanged.
[env:esp32-single-live]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -D FEEL_SINGLE_SERVO_LIVE=1

; Full six-servo deployment, gated by local physical measurement records.
; The prehook refuses to build or upload without all six verified records.
[env:esp32-production]
extends = env:esp32
extra_scripts = pre:tools/production_setup.py
build_flags = ${env:esp32.build_flags} -D FEEL_PRODUCTION_PROFILE=1

; Explicit experiment: ONE unloaded servo, unverified wider travel. Never six-servo production.
[env:esp32-single-wide-test]
extends = env:esp32-single-live
build_flags = ${env:esp32-single-live.build_flags} -D FEEL_SINGLE_SERVO_WIDE=1

; User-authorized six-channel experiment, not verified production calibration.
; Same +159us trim /2648us cap as the connected single-unit test.
[env:esp32-seven-live]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -D FEEL_SEVEN_SERVO_LIVE=1

; Six physical columns; wire slot zero is reserved and GPIO32 stays unused.
; Legacy seven-live environment now has the identical six-output behavior.
[env:esp32-six-live]
extends = env:esp32-seven-live
